          3. Open http://192.168.4.1
          4. Upload STEP4-HTML-CLOCK-OTA-APP.bin only
          5. Never upload FULL.bin through OTA
          EOF

              ls -lh /project/STEP4-HTML-CLOCK-*.bin
            '

