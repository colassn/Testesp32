          static void clock_timer_cb(lv_timer_t *timer)
          {
              (void)timer;

              if (clock_is_valid()) {
                  struct timeval now;
                  struct tm local_time;
                  char clock_buffer[16];
                  char milliseconds_buffer[16];
                  char date_buffer[64];

                  gettimeofday(&now, NULL);
                  localtime_r(&now.tv_sec, &local_time);

                  strftime(
                      clock_buffer,
                      sizeof(clock_buffer),
                      "%H:%M:%S",
                      &local_time);
                  snprintf(
                      milliseconds_buffer,
                      sizeof(milliseconds_buffer),
                      ".%03u",
                      (unsigned int)(now.tv_usec / 1000));
                  strftime(
                      date_buffer,
                      sizeof(date_buffer),
                      "%A  %d %B %Y",
                      &local_time);

                  if (clock_label != NULL) {
                      lv_label_set_text(
                          clock_label, clock_buffer);
                  }
                  if (milliseconds_label != NULL) {
                      lv_label_set_text(
                          milliseconds_label,
                          milliseconds_buffer);
                  }
                  if (date_label != NULL) {
                      lv_label_set_text(
                          date_label, date_buffer);
                  }
              } else {
                  if (clock_label != NULL) {
                      lv_label_set_text(
                          clock_label, "--:--:--");
                  }
                  if (milliseconds_label != NULL) {
                      lv_label_set_text(
                          milliseconds_label, ".---");
                  }
                  if (date_label != NULL) {
                      lv_label_set_text(
                          date_label, "WAITING FOR NTP");
                  }
              }

              if (stopwatch_label != NULL) {
                  int64_t elapsed =
                      stopwatch_elapsed_now();

                  if (elapsed < 0) {
                      elapsed = 0;
                  }

                  int64_t total_milliseconds =
                      elapsed / 1000;
                  int64_t hours =
                      total_milliseconds / 3600000;
                  int64_t minutes =
                      (total_milliseconds / 60000) % 60;
                  int64_t seconds =
                      (total_milliseconds / 1000) % 60;
                  int64_t milliseconds =
                      total_milliseconds % 1000;

                  char stopwatch_buffer[32];
                  snprintf(
                      stopwatch_buffer,
                      sizeof(stopwatch_buffer),
                      "%02lld:%02lld:%02lld.%03lld",
                      (long long)(hours % 100),
                      (long long)minutes,
                      (long long)seconds,
                      (long long)milliseconds);

                  lv_label_set_text(
                      stopwatch_label,
                      stopwatch_buffer);
              }
          }

          static esp_err_t initialise_nvs(void)
          {
              esp_err_t error = nvs_flash_init();

              if (error == ESP_ERR_NVS_NO_FREE_PAGES ||
                  error == ESP_ERR_NVS_NEW_VERSION_FOUND) {
                  ESP_ERROR_CHECK(nvs_flash_erase());
                  error = nvs_flash_init();
              }

              return error;
          }

          static esp_err_t initialise_spiffs(void)
          {
              esp_vfs_spiffs_conf_t configuration = {
                  .base_path = "/spiffs",
                  .partition_label = "storage",
                  .max_files = 5,
                  .format_if_mount_failed = true,
              };

              return esp_vfs_spiffs_register(&configuration);
          }

          static void load_wifi_credentials(void)
          {
              nvs_handle_t handle;
              size_t ssid_length = sizeof(saved_ssid);
              size_t password_length = sizeof(saved_password);

              saved_ssid[0] = '\0';
              saved_password[0] = '\0';

              if (nvs_open(
                      "wifi_cfg",
                      NVS_READONLY,
                      &handle) != ESP_OK) {
                  return;
              }

              if (nvs_get_str(
                      handle,
                      "ssid",
                      saved_ssid,
                      &ssid_length) != ESP_OK) {
                  saved_ssid[0] = '\0';
              }

              if (nvs_get_str(
                      handle,
                      "password",
                      saved_password,
                      &password_length) != ESP_OK) {
                  saved_password[0] = '\0';
              }

              nvs_close(handle);
          }

          static esp_err_t save_wifi_credentials(
              const char *ssid,
              const char *password)
          {
              nvs_handle_t handle;
              esp_err_t error =
                  nvs_open(
                      "wifi_cfg",
                      NVS_READWRITE,
                      &handle);

              if (error != ESP_OK) {
                  return error;
              }

              error = nvs_set_str(handle, "ssid", ssid);
              if (error == ESP_OK) {
                  error =
                      nvs_set_str(
                          handle, "password", password);
              }
              if (error == ESP_OK) {
                  error = nvs_commit(handle);
              }

              nvs_close(handle);
              return error;
          }

          static void set_wifi_status(const char *text)
          {
              strlcpy(
                  wifi_status_text,
                  text,
                  sizeof(wifi_status_text));

              if (wifi_label != NULL) {
                  lv_lock();
                  lv_label_set_text(
                      wifi_label, wifi_status_text);
                  lv_unlock();
              }
          }

          static void set_sync_status(const char *text)
          {
              strlcpy(
                  sync_status_text,
                  text,
                  sizeof(sync_status_text));

              if (sync_label != NULL) {
                  lv_lock();
                  lv_label_set_text(
                      sync_label, sync_status_text);
                  lv_unlock();
              }
          }

          static void wifi_event_handler(
              void *argument,
              esp_event_base_t event_base,
              int32_t event_id,
              void *event_data)
          {
              (void)argument;

              if (event_base == WIFI_EVENT &&
                  event_id == WIFI_EVENT_STA_START &&
                  saved_ssid[0] != '\0') {
                  esp_wifi_connect();
                  return;
              }

              if (event_base == WIFI_EVENT &&
                  event_id == WIFI_EVENT_STA_DISCONNECTED) {
                  xEventGroupClearBits(
                      wifi_events,
                      WIFI_CONNECTED_BIT);

                  if (saved_ssid[0] != '\0') {
                      set_wifi_status(
                          "Wi-Fi: reconnecting...");
                      set_sync_status(
                          "WAITING FOR WI-FI");
                      esp_wifi_connect();
                  }
                  return;
              }

              if (event_base == IP_EVENT &&
                  event_id == IP_EVENT_STA_GOT_IP) {
                  ip_event_got_ip_t *event = event_data;
                  char text[128];

                  snprintf(
                      text,
                      sizeof(text),
                      "Wi-Fi: %s  " IPSTR "  |  OTA 192.168.4.1",
                      saved_ssid,
                      IP2STR(&event->ip_info.ip));
                  set_wifi_status(text);

                  xEventGroupSetBits(
                      wifi_events,
                      WIFI_CONNECTED_BIT);
              }
          }

          static void start_wifi(void)
          {
              wifi_events = xEventGroupCreate();
              load_wifi_credentials();

              ESP_ERROR_CHECK(esp_netif_init());
              ESP_ERROR_CHECK(
                  esp_event_loop_create_default());
              esp_netif_create_default_wifi_ap();
              esp_netif_create_default_wifi_sta();

              wifi_init_config_t init_configuration =
                  WIFI_INIT_CONFIG_DEFAULT();
              ESP_ERROR_CHECK(
                  esp_wifi_init(&init_configuration));

              ESP_ERROR_CHECK(
                  esp_event_handler_register(
                      WIFI_EVENT,
                      ESP_EVENT_ANY_ID,
                      wifi_event_handler,
                      NULL));
              ESP_ERROR_CHECK(
                  esp_event_handler_register(
                      IP_EVENT,
                      IP_EVENT_STA_GOT_IP,
                      wifi_event_handler,
                      NULL));

              wifi_config_t access_point = {0};
              strlcpy(
                  (char *)access_point.ap.ssid,
                  SETUP_AP_SSID,
                  sizeof(access_point.ap.ssid));
              strlcpy(
                  (char *)access_point.ap.password,
                  SETUP_AP_PASS,
                  sizeof(access_point.ap.password));
              access_point.ap.ssid_len =
                  strlen(SETUP_AP_SSID);
              access_point.ap.channel = 1;
              access_point.ap.max_connection = 4;
              access_point.ap.authmode =
                  WIFI_AUTH_WPA2_PSK;
              access_point.ap.pmf_cfg.required = false;

              ESP_ERROR_CHECK(
                  esp_wifi_set_mode(WIFI_MODE_APSTA));
              ESP_ERROR_CHECK(
                  esp_wifi_set_config(
                      WIFI_IF_AP, &access_point));

              if (saved_ssid[0] != '\0') {
                  wifi_config_t station = {0};

                  strlcpy(
                      (char *)station.sta.ssid,
                      saved_ssid,
                      sizeof(station.sta.ssid));
                  strlcpy(
                      (char *)station.sta.password,
                      saved_password,
                      sizeof(station.sta.password));

                  station.sta.threshold.authmode =
                      WIFI_AUTH_WPA2_PSK;
                  station.sta.pmf_cfg.capable = true;
                  station.sta.pmf_cfg.required = false;

                  ESP_ERROR_CHECK(
                      esp_wifi_set_config(
                          WIFI_IF_STA, &station));
              }

              ESP_ERROR_CHECK(esp_wifi_start());
          }

          static bool url_decode(
              char *destination,
              size_t destination_size,
              const char *source)
          {
              if (destination_size == 0) {
                  return false;
              }

              size_t written = 0;

              while (*source != '\0' &&
                     written + 1 < destination_size) {
                  if (*source == '%' &&
                      source[1] != '\0' &&
                      source[2] != '\0') {
                      char hex[3] = {
                          source[1],
                          source[2],
                          '\0',
                      };
                      destination[written++] =
                          (char)strtol(hex, NULL, 16);
                      source += 3;
                  } else if (*source == '+') {
                      destination[written++] = ' ';
                      source++;
                  } else {
                      destination[written++] = *source++;
                  }
              }

              destination[written] = '\0';
              return *source == '\0';
          }

          static esp_err_t receive_request_body(
              httpd_req_t *request,
              char *buffer,
              size_t length)
          {
              size_t received_total = 0;

              while (received_total < length) {
                  int count = httpd_req_recv(
                      request,
                      buffer + received_total,
                      length - received_total);

                  if (count == HTTPD_SOCK_ERR_TIMEOUT) {
                      continue;
                  }
                  if (count <= 0) {
                      return ESP_FAIL;
                  }

                  received_total += (size_t)count;
              }

              return ESP_OK;
          }

          static esp_err_t index_get_handler(
              httpd_req_t *request)
          {
              httpd_resp_set_type(
                  request, "text/html");
              httpd_resp_set_hdr(
                  request,
                  "Cache-Control",
                  "no-store");
              return httpd_resp_send(
                  request,
                  MANAGEMENT_PAGE,
                  HTTPD_RESP_USE_STRLEN);
          }

          static esp_err_t status_get_handler(
              httpd_req_t *request)
          {
              bool connected =
                  (xEventGroupGetBits(wifi_events) &
                   WIFI_CONNECTED_BIT) != 0;
              char ip_text[24] = "";

              if (connected) {
                  esp_netif_t *network_interface =
                      esp_netif_get_handle_from_ifkey(
                          "WIFI_STA_DEF");
                  esp_netif_ip_info_t information;

                  if (network_interface != NULL &&
                      esp_netif_get_ip_info(
                          network_interface,
                          &information) == ESP_OK) {
                      snprintf(
                          ip_text,
                          sizeof(ip_text),
                          IPSTR,
                          IP2STR(&information.ip));
                  }
              }

              char response[512];
              snprintf(
                  response,
                  sizeof(response),
                  "{\"connected\":%s,"
                  "\"ssid\":\"%s\","
                  "\"ip\":\"%s\","
                  "\"clock\":\"%s\","
                  "\"html\":\"%s\"}",
                  connected ? "true" : "false",
                  saved_ssid,
                  ip_text,
                  clock_is_valid()
                      ? "NTP synchronized"
                      : "waiting for NTP",
                  html_file_ready
                      ? "display.html ready"
                      : "using built-in fallback");

              httpd_resp_set_type(
                  request, "application/json");
              httpd_resp_set_hdr(
                  request,
                  "Cache-Control",
                  "no-store");
              return httpd_resp_sendstr(
                  request, response);
          }

          static esp_err_t html_get_handler(
              httpd_req_t *request)
          {
              char *html =
                  read_text_file(
                      DISPLAY_HTML_PATH,
                      DISPLAY_HTML_MAX);

              if (html == NULL) {
                  httpd_resp_set_type(
                      request,
                      "text/plain; charset=utf-8");
                  return httpd_resp_send(
                      request,
                      DEFAULT_DISPLAY_HTML,
                      HTTPD_RESP_USE_STRLEN);
              }

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              httpd_resp_set_hdr(
                  request,
                  "Cache-Control",
                  "no-store");
              esp_err_t result =
                  httpd_resp_send(
                      request,
                      html,
                      HTTPD_RESP_USE_STRLEN);
              free(html);
              return result;
          }

          static esp_err_t html_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0 ||
                  request->content_len > DISPLAY_HTML_MAX) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML must be 1 to 16384 bytes");
                  return ESP_FAIL;
              }

              char *html =
                  calloc(
                      1,
                      request->content_len + 1);
              if (html == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              esp_err_t result =
                  receive_request_body(
                      request,
                      html,
                      request->content_len);

              if (result != ESP_OK) {
                  free(html);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML receive failed");
                  return ESP_FAIL;
              }

              html[request->content_len] = '\0';

              result =
                  write_display_html(
                      html,
                      request->content_len);

              if (result != ESP_OK) {
                  free(html);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML must contain <body> and data-widget=clock");
                  return ESP_FAIL;
              }

              lv_lock();
              render_display_html(html);
              lv_unlock();
              free(html);

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              return httpd_resp_sendstr(
                  request,
                  "Saved. The LCD has reloaded display.html.");
          }

          static esp_err_t default_post_handler(
              httpd_req_t *request)
          {
              (void)request;

              esp_err_t result =
                  write_display_html(
                      DEFAULT_DISPLAY_HTML,
                      strlen(DEFAULT_DISPLAY_HTML));

              if (result != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Could not restore default HTML");
                  return ESP_FAIL;
              }

              lv_lock();
              render_display_html(
                  DEFAULT_DISPLAY_HTML);
              lv_unlock();

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              return httpd_resp_sendstr(
                  request,
                  "Default clock restored.");
          }

          static esp_err_t wifi_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0 ||
                  request->content_len > 512) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid form data");
                  return ESP_FAIL;
              }

              char *body =
                  calloc(
                      1,
                      request->content_len + 1);
              if (body == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              if (receive_request_body(
                      request,
                      body,
                      request->content_len) != ESP_OK) {
                  free(body);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Form receive failed");
                  return ESP_FAIL;
              }

              char encoded_ssid[100] = "";
              char encoded_password[180] = "";
              char decoded_ssid[33] = "";
              char decoded_password[65] = "";

              esp_err_t ssid_result =
                  httpd_query_key_value(
                      body,
                      "ssid",
                      encoded_ssid,
                      sizeof(encoded_ssid));
              esp_err_t password_result =
                  httpd_query_key_value(
                      body,
                      "password",
                      encoded_password,
                      sizeof(encoded_password));
              free(body);

              if (ssid_result != ESP_OK ||
                  !url_decode(
                      decoded_ssid,
                      sizeof(decoded_ssid),
                      encoded_ssid)) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid SSID");
                  return ESP_FAIL;
              }

              if (password_result == ESP_OK &&
                  !url_decode(
                      decoded_password,
                      sizeof(decoded_password),
                      encoded_password)) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid password");
                  return ESP_FAIL;
              }

              if (decoded_ssid[0] == '\0' ||
                  save_wifi_credentials(
                      decoded_ssid,
                      decoded_password) != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Could not save Wi-Fi details");
                  return ESP_FAIL;
              }

              httpd_resp_set_type(
                  request, "text/plain");
              httpd_resp_sendstr(
                  request,
                  "Wi-Fi saved. The display is restarting.");
              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          static esp_err_t local_ota_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Empty upload");
                  return ESP_FAIL;
              }

              const esp_partition_t *partition =
                  esp_ota_get_next_update_partition(NULL);

              if (partition == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "No OTA partition");
                  return ESP_FAIL;
              }

              esp_ota_handle_t ota_handle;
              esp_err_t error =
                  esp_ota_begin(
                      partition,
                      request->content_len,
                      &ota_handle);

              if (error != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "OTA start failed");
                  return ESP_FAIL;
              }

              char *buffer =
                  malloc(LOCAL_OTA_BUFFER);
              if (buffer == NULL) {
                  esp_ota_abort(ota_handle);
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              int remaining =
                  request->content_len;

              while (remaining > 0) {
                  int wanted =
                      remaining > LOCAL_OTA_BUFFER
                          ? LOCAL_OTA_BUFFER
                          : remaining;
                  int count =
                      httpd_req_recv(
                          request,
                          buffer,
                          wanted);

                  if (count == HTTPD_SOCK_ERR_TIMEOUT) {
                      continue;
                  }

                  if (count <= 0 ||
                      esp_ota_write(
                          ota_handle,
                          buffer,
                          count) != ESP_OK) {
                      free(buffer);
                      esp_ota_abort(ota_handle);
                      httpd_resp_send_err(
                          request,
                          HTTPD_500_INTERNAL_SERVER_ERROR,
                          "OTA upload failed");
                      return ESP_FAIL;
                  }

                  remaining -= count;
              }

              free(buffer);
              error = esp_ota_end(ota_handle);

              if (error != ESP_OK ||
                  esp_ota_set_boot_partition(
                      partition) != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid OTA APP firmware");
                  return ESP_FAIL;
              }

              httpd_resp_set_type(
                  request, "text/plain");
              httpd_resp_sendstr(
                  request,
                  "Update successful. The display is restarting.");
              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          static void start_web_server(void)
          {
              httpd_config_t configuration =
                  HTTPD_DEFAULT_CONFIG();
              configuration.stack_size = 12288;
              configuration.recv_wait_timeout = 60;
              configuration.send_wait_timeout = 60;
              configuration.max_uri_handlers = 10;

              ESP_ERROR_CHECK(
                  httpd_start(
                      &web_server,
                      &configuration));

              const httpd_uri_t routes[] = {
                  {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = index_get_handler,
                  },
                  {
                      .uri = "/api/status",
                      .method = HTTP_GET,
                      .handler = status_get_handler,
                  },
                  {
                      .uri = "/api/html",
                      .method = HTTP_GET,
                      .handler = html_get_handler,
                  },
                  {
                      .uri = "/api/html",
                      .method = HTTP_POST,
                      .handler = html_post_handler,
                  },
                  {
                      .uri = "/api/default",
                      .method = HTTP_POST,
                      .handler = default_post_handler,
                  },
                  {
                      .uri = "/wifi",
                      .method = HTTP_POST,
                      .handler = wifi_post_handler,
                  },
                  {
                      .uri = "/update",
                      .method = HTTP_POST,
                      .handler = local_ota_post_handler,
                  },
              };

              for (size_t index = 0;
                   index <
                       sizeof(routes) /
                       sizeof(routes[0]);
                   ++index) {
                  ESP_ERROR_CHECK(
                      httpd_register_uri_handler(
                          web_server,
                          &routes[index]));
              }
          }

          static esp_err_t ensure_sntp_time(void)
          {
              if (clock_is_valid()) {
                  return ESP_OK;
              }

              if (!sntp_started) {
                  esp_sntp_config_t configuration =
                      ESP_NETIF_SNTP_DEFAULT_CONFIG(
                          "pool.ntp.org");
                  esp_err_t error =
                      esp_netif_sntp_init(
                          &configuration);

                  if (error != ESP_OK &&
                      error != ESP_ERR_INVALID_STATE) {
                      return error;
                  }

                  sntp_started = true;
              }

              return esp_netif_sntp_sync_wait(
                  pdMS_TO_TICKS(15000));
          }

          static void time_sync_task(void *argument)
          {
              (void)argument;

              for (;;) {
                  xEventGroupWaitBits(
                      wifi_events,
                      WIFI_CONNECTED_BIT,
                      pdFALSE,
                      pdTRUE,
                      portMAX_DELAY);

                  set_sync_status(
                      "SYNCING HONG KONG TIME...");

                  if (ensure_sntp_time() != ESP_OK) {
                      set_sync_status(
                          "TIME SYNC FAILED - RETRYING");
                      vTaskDelay(
                          pdMS_TO_TICKS(30000));
                      continue;
                  }

                  set_sync_status(
                      "TIME SYNCHRONIZED");
                  vTaskDelay(
                      pdMS_TO_TICKS(
                          60 * 60 * 1000));
              }
          }

          void app_main(void)
          {
              ESP_ERROR_CHECK(initialise_nvs());
              ESP_ERROR_CHECK(initialise_spiffs());

              load_theme_preference();
              ESP_ERROR_CHECK(
                  ensure_default_display_html());

              setenv("TZ", "HKT-8", 1);
              tzset();

              sunton_esp32s3_backlight_init();

              lv_display_t *display =
                  sunton_esp32s3_lcd_init();
              (void)display;

              i2c_master_bus_handle_t i2c_master =
                  sunton_esp32s3_i2c_master();
              sunton_esp32s3_touch_init(i2c_master);

              lv_lock();
              reload_display_locked();
              lv_timer_create(
                  clock_timer_cb, 20, NULL);
              lv_unlock();

              start_wifi();
              start_web_server();

              xTaskCreate(
                  time_sync_task,
                  "time_sync",
                  4096,
                  NULL,
                  5,
                  NULL);
          }
