            bash -lc '
              set -e
              . /opt/esp/idf/export.sh
              idf.py set-target esp32s3
              idf.py build
              idf.py merge-bin -f raw

              cp build/merged-binary.bin \
                 /project/STEP4-HTML-CLOCK-FULL.bin
              cp build/ESP32-8048S050C.bin \
                 /project/STEP4-HTML-CLOCK-OTA-APP.bin

              cat > /project/README.txt <<EOF
          STEP 4 HTML CLOCK ENGINE
          - display.html is stored in ESP32 SPIFFS
          - Edit HTML from http://192.168.4.1
          - Large Hong Kong clock with milliseconds
          - Light/dark touch mode
          - Stopwatch start/pause/reset
          - Home Wi-Fi and NTP time
