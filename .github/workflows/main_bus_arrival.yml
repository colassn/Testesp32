name: Build Bus Arrival OTA App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone working display project
        run: |
          git clone --depth 1 https://github.com/mr-sven/esp32-8048S050C.git project

      - name: Add bus arrival screen and OTA
        run: |
          cat > project/main/main.c <<'MAIN_C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          #include "esp_event.h"
          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "esp_netif.h"
          #include "esp_ota_ops.h"
          #include "esp_system.h"
          #include "esp_wifi.h"
          #include "nvs_flash.h"

          #include "driver/i2c_master.h"
          #include "lvgl.h"

          #include "sunton_esp32_8048s050c.h"

          #define OTA_AP_SSID "ESP32-Display-OTA"
          #define OTA_AP_PASS "esp32ota88"
          #define OTA_BUF_SIZE 4096

          static const char *TAG = "bus_eta";
          static httpd_handle_t ota_server = NULL;

          static lv_obj_t *eta_labels[3] = {NULL, NULL, NULL};
          static lv_obj_t *updated_label = NULL;
          static int eta_seconds[3] = {180, 660, 1440};
          static uint32_t refresh_count = 0;

          static const char OTA_PAGE[] =
              "<!doctype html><html><head>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>ESP32 Display OTA</title>"
              "<style>"
              "body{font-family:sans-serif;max-width:560px;margin:40px auto;padding:20px;"
              "background:#f4f7f7;color:#173332}"
              ".box{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 24px #0002}"
              "button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:10px;"
              "background:#138b7e;color:white;font-size:18px}"
              "input{width:100%;margin-top:14px}"
              "#s{white-space:pre-wrap;margin-top:16px}"
              "</style></head><body><div class='box'>"
              "<h2>ESP32-8048S050C OTA</h2>"
              "<p>Select the <b>OTA APP .bin</b>, not a FULL/merged file.</p>"
              "<input id='f' type='file' accept='.bin'>"
              "<button onclick='upload()'>Upload and restart</button>"
              "<div id='s'>Ready.</div>"
              "</div><script>"
              "async function upload(){"
              "const f=document.getElementById('f').files[0];"
              "const s=document.getElementById('s');"
              "if(!f){s.textContent='Please choose a .bin file first.';return;}"
              "if(!confirm('Upload '+f.name+'?'))return;"
              "s.textContent='Uploading... Keep this page open.';"
              "try{"
              "const r=await fetch('/update',{method:'POST',"
              "headers:{'Content-Type':'application/octet-stream'},body:f});"
              "s.textContent=await r.text();"
              "}catch(e){s.textContent='Connection closed. The board may be restarting.';}"
              "}"
              "</script></body></html>";

          static esp_err_t ota_index_get(httpd_req_t *req)
          {
              httpd_resp_set_type(req, "text/html");
              httpd_resp_set_hdr(req, "Cache-Control", "no-store");
              return httpd_resp_send(req, OTA_PAGE, HTTPD_RESP_USE_STRLEN);
          }

          static esp_err_t ota_update_post(httpd_req_t *req)
          {
              if (req->content_len <= 0) {
                  httpd_resp_send_err(req, HTTPD_400_BAD_REQUEST, "Empty upload");
                  return ESP_FAIL;
              }

              const esp_partition_t *update_partition =
                  esp_ota_get_next_update_partition(NULL);
              if (update_partition == NULL) {
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                      "No OTA partition found");
                  return ESP_FAIL;
              }

              esp_ota_handle_t update_handle = 0;
              esp_err_t err =
                  esp_ota_begin(update_partition, req->content_len, &update_handle);
              if (err != ESP_OK) {
                  ESP_LOGE(TAG, "esp_ota_begin failed: %s", esp_err_to_name(err));
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                      "OTA begin failed");
                  return ESP_FAIL;
              }

              char *buffer = malloc(OTA_BUF_SIZE);
              if (buffer == NULL) {
                  esp_ota_abort(update_handle);
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                      "Out of memory");
                  return ESP_FAIL;
              }

              int remaining = req->content_len;
              while (remaining > 0) {
                  const int wanted =
                      remaining > OTA_BUF_SIZE ? OTA_BUF_SIZE : remaining;
                  const int received = httpd_req_recv(req, buffer, wanted);

                  if (received == HTTPD_SOCK_ERR_TIMEOUT) {
                      continue;
                  }
                  if (received <= 0) {
                      free(buffer);
                      esp_ota_abort(update_handle);
                      httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                          "Upload interrupted");
                      return ESP_FAIL;
                  }

                  err = esp_ota_write(update_handle, buffer, received);
                  if (err != ESP_OK) {
                      free(buffer);
                      esp_ota_abort(update_handle);
                      httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                          "Flash write failed");
                      return ESP_FAIL;
                  }

                  remaining -= received;
              }

              free(buffer);

              err = esp_ota_end(update_handle);
              if (err != ESP_OK) {
                  httpd_resp_send_err(req, HTTPD_400_BAD_REQUEST,
                                      "Invalid or incompatible APP firmware");
                  return ESP_FAIL;
              }

              err = esp_ota_set_boot_partition(update_partition);
              if (err != ESP_OK) {
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR,
                                      "Could not select new firmware");
                  return ESP_FAIL;
              }

              httpd_resp_set_type(req, "text/plain");
              httpd_resp_sendstr(req,
                  "Update successful. The display is restarting now.");
              vTaskDelay(pdMS_TO_TICKS(1200));
              esp_restart();
              return ESP_OK;
          }

          static void start_ota_server(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              config.stack_size = 8192;
              config.recv_wait_timeout = 60;
              config.send_wait_timeout = 60;
              config.max_uri_handlers = 6;

              ESP_ERROR_CHECK(httpd_start(&ota_server, &config));

              const httpd_uri_t index_uri = {
                  .uri = "/",
                  .method = HTTP_GET,
                  .handler = ota_index_get,
                  .user_ctx = NULL,
              };

              const httpd_uri_t update_uri = {
                  .uri = "/update",
                  .method = HTTP_POST,
                  .handler = ota_update_post,
                  .user_ctx = NULL,
              };

              ESP_ERROR_CHECK(httpd_register_uri_handler(ota_server, &index_uri));
              ESP_ERROR_CHECK(httpd_register_uri_handler(ota_server, &update_uri));
          }

          static void start_ota_softap(void)
          {
              esp_err_t err = nvs_flash_init();
              if (err == ESP_ERR_NVS_NO_FREE_PAGES ||
                  err == ESP_ERR_NVS_NEW_VERSION_FOUND) {
                  ESP_ERROR_CHECK(nvs_flash_erase());
                  ESP_ERROR_CHECK(nvs_flash_init());
              } else {
                  ESP_ERROR_CHECK(err);
              }

              ESP_ERROR_CHECK(esp_netif_init());
              ESP_ERROR_CHECK(esp_event_loop_create_default());
              esp_netif_create_default_wifi_ap();

              wifi_init_config_t cfg = WIFI_INIT_CONFIG_DEFAULT();
              ESP_ERROR_CHECK(esp_wifi_init(&cfg));

              wifi_config_t wifi_config = {0};
              strlcpy((char *)wifi_config.ap.ssid, OTA_AP_SSID,
                      sizeof(wifi_config.ap.ssid));
              strlcpy((char *)wifi_config.ap.password, OTA_AP_PASS,
                      sizeof(wifi_config.ap.password));
              wifi_config.ap.ssid_len = strlen(OTA_AP_SSID);
              wifi_config.ap.channel = 1;
              wifi_config.ap.max_connection = 4;
              wifi_config.ap.authmode = WIFI_AUTH_WPA2_PSK;
              wifi_config.ap.pmf_cfg.required = false;

              ESP_ERROR_CHECK(esp_wifi_set_mode(WIFI_MODE_AP));
              ESP_ERROR_CHECK(esp_wifi_set_config(WIFI_IF_AP, &wifi_config));
              ESP_ERROR_CHECK(esp_wifi_start());
              start_ota_server();
          }

          static void set_card_style(lv_obj_t *obj, uint32_t bg)
          {
              lv_obj_set_style_bg_color(obj, lv_color_hex(bg), 0);
              lv_obj_set_style_bg_opa(obj, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(obj, 14, 0);
              lv_obj_set_style_border_width(obj, 0, 0);
              lv_obj_set_style_pad_all(obj, 0, 0);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLLABLE);
          }

          static void format_eta(char *buffer, size_t size, int seconds)
          {
              if (seconds <= 30) {
                  snprintf(buffer, size, "DUE");
                  return;
              }

              const int minutes = (seconds + 59) / 60;
              snprintf(buffer, size, "%d min", minutes);
          }

          static void update_eta_labels(void)
          {
              char text[20];

              for (int i = 0; i < 3; i++) {
                  format_eta(text, sizeof(text), eta_seconds[i]);
                  lv_label_set_text(eta_labels[i], text);
              }

              snprintf(text, sizeof(text), "Updated %lus ago",
                       (unsigned long)refresh_count);
              lv_label_set_text(updated_label, text);
          }

          static void eta_timer_cb(lv_timer_t *timer)
          {
              (void)timer;

              for (int i = 0; i < 3; i++) {
                  eta_seconds[i]--;

                  if (eta_seconds[i] < -30) {
                      eta_seconds[0] = eta_seconds[1];
                      eta_seconds[1] = eta_seconds[2];
                      eta_seconds[2] = eta_seconds[1] + 780;
                      break;
                  }
              }

              refresh_count++;
              update_eta_labels();
          }

          static void refresh_clicked(lv_event_t *event)
          {
              (void)event;
              eta_seconds[0] = 180;
              eta_seconds[1] = 660;
              eta_seconds[2] = 1440;
              refresh_count = 0;
              update_eta_labels();
          }

          static lv_obj_t *make_label(
              lv_obj_t *parent,
              const char *text,
              int x,
              int y,
              const lv_font_t *font,
              uint32_t color)
          {
              lv_obj_t *label = lv_label_create(parent);
              lv_label_set_text(label, text);
              lv_obj_set_pos(label, x, y);
              lv_obj_set_style_text_font(label, font, 0);
              lv_obj_set_style_text_color(label, lv_color_hex(color), 0);
              return label;
          }

          static void make_eta_row(
              lv_obj_t *screen,
              int y,
              const char *sequence,
              const char *note,
              uint32_t accent,
              int index)
          {
              lv_obj_t *card = lv_obj_create(screen);
              lv_obj_set_pos(card, 20, y);
              lv_obj_set_size(card, 760, 72);
              set_card_style(card, 0xFFFFFF);

              lv_obj_t *bar = lv_obj_create(card);
              lv_obj_set_pos(bar, 0, 0);
              lv_obj_set_size(bar, 9, 72);
              set_card_style(bar, accent);
              lv_obj_set_style_radius(bar, 0, 0);

              make_label(card, sequence, 28, 11,
                         &lv_font_montserrat_20, 0x17222B);
              make_label(card, note, 28, 40,
                         &lv_font_montserrat_14, 0x6B7680);

              eta_labels[index] = make_label(
                  card, "--", 610, 16,
                  &lv_font_montserrat_32, accent);
              lv_obj_set_width(eta_labels[index], 125);
              lv_obj_set_style_text_align(
                  eta_labels[index], LV_TEXT_ALIGN_RIGHT, 0);
          }

          static void create_bus_arrival_ui(void)
          {
              lv_obj_t *screen = lv_screen_active();
              lv_obj_remove_style_all(screen);
              lv_obj_set_style_bg_color(screen, lv_color_hex(0xEEF1F4), 0);
              lv_obj_set_style_bg_opa(screen, LV_OPA_COVER, 0);
              lv_obj_clear_flag(screen, LV_OBJ_FLAG_SCROLLABLE);

              lv_obj_t *header = lv_obj_create(screen);
              lv_obj_set_pos(header, 0, 0);
              lv_obj_set_size(header, 800, 76);
              set_card_style(header, 0xC9152B);
              lv_obj_set_style_radius(header, 0, 0);

              lv_obj_t *route = lv_obj_create(header);
              lv_obj_set_pos(route, 20, 12);
              lv_obj_set_size(route, 118, 52);
              set_card_style(route, 0xFFD447);

              lv_obj_t *route_label = make_label(
                  route, "962B", 0, 7,
                  &lv_font_montserrat_36, 0x151515);
              lv_obj_set_width(route_label, 118);
              lv_obj_set_style_text_align(
                  route_label, LV_TEXT_ALIGN_CENTER, 0);

              make_label(header, "BUS ARRIVALS", 158, 10,
                         &lv_font_montserrat_20, 0xFFFFFF);
              make_label(header, "Towards Causeway Bay", 158, 39,
                         &lv_font_montserrat_14, 0xFFE7EA);

              lv_obj_t *refresh_btn = lv_button_create(header);
              lv_obj_set_pos(refresh_btn, 666, 14);
              lv_obj_set_size(refresh_btn, 114, 48);
              lv_obj_set_style_bg_color(
                  refresh_btn, lv_color_hex(0x9F1022), 0);
              lv_obj_set_style_radius(refresh_btn, 12, 0);
              lv_obj_add_event_cb(
                  refresh_btn, refresh_clicked, LV_EVENT_CLICKED, NULL);

              lv_obj_t *refresh_text = lv_label_create(refresh_btn);
              lv_label_set_text(refresh_text, "REFRESH");
              lv_obj_set_style_text_font(
                  refresh_text, &lv_font_montserrat_14, 0);
              lv_obj_center(refresh_text);

              lv_obj_t *stop_card = lv_obj_create(screen);
              lv_obj_set_pos(stop_card, 20, 90);
              lv_obj_set_size(stop_card, 760, 78);
              set_card_style(stop_card, 0x17222B);

              make_label(stop_card, "STOP", 24, 12,
                         &lv_font_montserrat_14, 0x94A1AA);
              make_label(stop_card, "Tuen Mun Town Centre", 88, 8,
                         &lv_font_montserrat_28, 0xFFFFFF);
              make_label(stop_card,
                         "Platform A  |  Live demonstration timetable",
                         88, 46, &lv_font_montserrat_14, 0xCBD2D8);

              make_eta_row(screen, 182, "1st bus",
                           "Low-floor service", 0x15916F, 0);
              make_eta_row(screen, 260, "2nd bus",
                           "Scheduled service", 0xD88400, 1);
              make_eta_row(screen, 338, "3rd bus",
                           "Scheduled service", 0x5163D8, 2);

              lv_obj_t *footer = lv_obj_create(screen);
              lv_obj_set_pos(footer, 0, 428);
              lv_obj_set_size(footer, 800, 52);
              set_card_style(footer, 0x17222B);
              lv_obj_set_style_radius(footer, 0, 0);

              updated_label = make_label(
                  footer, "Updated 0s ago", 20, 16,
                  &lv_font_montserrat_14, 0xFFFFFF);

              lv_obj_t *ota = make_label(
                  footer,
                  "OTA  ESP32-Display-OTA  |  192.168.4.1",
                  348, 16, &lv_font_montserrat_14, 0xBFD0D7);
              lv_obj_set_width(ota, 430);
              lv_obj_set_style_text_align(ota, LV_TEXT_ALIGN_RIGHT, 0);

              update_eta_labels();
              lv_timer_create(eta_timer_cb, 1000, NULL);
          }

          void app_main(void)
          {
              start_ota_softap();

              sunton_esp32s3_backlight_init();
              lv_display_t *display = sunton_esp32s3_lcd_init();
              (void)display;

              i2c_master_bus_handle_t i2c_master =
                  sunton_esp32s3_i2c_master();
              sunton_esp32s3_touch_init(i2c_master);

              lv_lock();
              create_bus_arrival_ui();
              lv_unlock();
          }
          MAIN_C

          cat > project/main/CMakeLists.txt <<'CMAKE'
          idf_component_register(
              SRCS "main.c" "sunton_esp32_8048s050c.c"
              INCLUDE_DIRS "."
              REQUIRES
                  lvgl
                  esp_lcd
                  esp_lcd_touch_gt911
                  esp_timer
                  nvs_flash
                  esp_wifi
                  esp_netif
                  esp_event
                  esp_http_server
                  app_update
          )
          CMAKE

          cat > project/partitions_ota.csv <<'PARTITIONS'
          # Name,    Type, SubType, Offset,   Size,     Flags
          nvs,       data, nvs,     0x9000,   0x4000,
          otadata,   data, ota,     0xd000,   0x2000,
          phy_init,  data, phy,     0xf000,   0x1000,
          factory,   app,  factory, 0x10000,  0x400000,
          ota_0,     app,  ota_0,   0x410000, 0x400000,
          ota_1,     app,  ota_1,   0x810000, 0x400000,
          storage,   data, spiffs,  0xc10000, 0x3f0000,
          PARTITIONS

          sed -i '/CONFIG_PARTITION_TABLE_/d' project/sdkconfig.defaults
          cat >> project/sdkconfig.defaults <<'SDK'
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions_ota.csv"
          CONFIG_PARTITION_TABLE_FILENAME="partitions_ota.csv"
          CONFIG_LV_FONT_MONTSERRAT_14=y
          CONFIG_LV_FONT_MONTSERRAT_20=y
          CONFIG_LV_FONT_MONTSERRAT_28=y
          CONFIG_LV_FONT_MONTSERRAT_32=y
          CONFIG_LV_FONT_MONTSERRAT_36=y
          SDK

      - name: Build bus arrival firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/project:/project" \
            -w /project \
            espressif/idf:v5.5.2 \
            bash -lc '
              set -e
              . /opt/esp/idf/export.sh
              idf.py set-target esp32s3
              idf.py build
              idf.py merge-bin -f raw

              cp build/merged-binary.bin \
                 /project/ESP32-BUS-ARRIVAL-FULL.bin
              cp build/ESP32-8048S050C.bin \
                 /project/ESP32-BUS-ARRIVAL-OTA-APP.bin

              cat > /project/README.txt <<EOF
          UPDATE THROUGH THE EXISTING OTA WEB PAGE:
          1. Connect to ESP32-Display-OTA
          2. Password: esp32ota88
          3. Open http://192.168.4.1
          4. Upload ESP32-BUS-ARRIVAL-OTA-APP.bin

          Do not upload the FULL file through the OTA page.
          This first version uses simulated bus arrival countdowns.
          EOF

              ls -lh /project/ESP32-BUS-ARRIVAL-*.bin
            '

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Bus-Arrival-OTA
          path: |
            project/ESP32-BUS-ARRIVAL-OTA-APP.bin
            project/ESP32-BUS-ARRIVAL-FULL.bin
            project/README.txt
          if-no-files-found: error
