name: Build ESP32-8048S050C Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Clone board demo
        run: |
          git clone --depth 1 https://github.com/mr-sven/esp32-8048S050C.git project

      - name: Build firmware
        working-directory: project
        run: |
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin
          cp build/merged-binary.bin ../ESP32-8048S050C_full.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-8048S050C-firmware
          path: ESP32-8048S050C_full.bin
