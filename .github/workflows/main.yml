name: Build ESP32-8048S050C Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone ESP32-8048S050C project
        run: |
          git clone --depth 1 https://github.com/mr-sven/esp32-8048S050C.git project

      - name: Build firmware with ESP-IDF
        run: |
          docker run --rm \
            -v "$PWD/project:/project" \
            -w /project \
            espressif/idf:v5.5.2 \
            bash -lc '
              . /opt/esp/idf/export.sh
              idf.py set-target esp32s3
              idf.py build
              idf.py merge-bin -o build/ESP32-8048S050C_full.bin
            '

      - name: Check generated firmware
        run: |
          ls -lh project/build/
          test -f project/build/ESP32-8048S050C_full.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-8048S050C-firmware
          path: project/build/ESP32-8048S050C_full.bin
          if-no-files-found: error
