name: Build ESP32-8048S050C Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone ESP32-8048S050C project
        run: |
          git clone --depth 1 https://github.com/mr-sven/esp32-8048S050C.git project

      - name: Build firmware with ESP-IDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/project:/project" \
            -w /project \
            espressif/idf:v5.5.2 \
            bash -lc '
              set -e
              . /opt/esp/idf/export.sh

              idf.py set-target esp32s3
              idf.py build
              idf.py merge-bin -f raw

              cp build/merged-binary.bin \
                 /project/ESP32-8048S050C_full.bin

              ls -lh /project/ESP32-8048S050C_full.bin
            '

      - name: Verify firmware
        run: |
          test -s project/ESP32-8048S050C_full.bin
          ls -lh project/ESP32-8048S050C_full.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-8048S050C-firmware
          path: project/ESP32-8048S050C_full.bin
          if-no-files-found: error
