              lv_obj_set_pos(card, 20, y);
              lv_obj_set_size(card, 760, 72);
              set_card_style(card, 0xffffff);

              lv_obj_t *bar = lv_obj_create(card);
              lv_obj_set_pos(bar, 0, 0);
              lv_obj_set_size(bar, 9, 72);
              set_card_style(bar, accent);
              lv_obj_set_style_radius(bar, 0, 0);

              make_label(card, sequence, 28, 11,
                         &lv_font_montserrat_20, 0x17222b);
              make_label(card, note, 28, 40,
                         &lv_font_montserrat_14, 0x6b7680);

              eta_labels[index] = make_label(
                  card, "--", 610, 16,
                  &lv_font_montserrat_32, accent);
              lv_obj_set_width(eta_labels[index], 125);
              lv_obj_set_style_text_align(
                  eta_labels[index], LV_TEXT_ALIGN_RIGHT, 0);
          }

