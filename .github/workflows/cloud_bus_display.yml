name: Build and publish Bus Display cloud OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloud_bus_display.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bus-display-pages
  cancel-in-progress: true

env:
  BOARD_REPOSITORY: https://github.com/mr-sven/esp32-8048S050C.git
  PAGES_BASE_URL: https://colassn.github.io/Testesp32
  IDF_IMAGE: espressif/idf:v5.5.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone proven display project
        run: |
          git clone --depth 1 "$BOARD_REPOSITORY" project

      - name: Add home Wi-Fi, setup portal, bus UI and cloud OTA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          cat > project/main/main.c <<'MAIN_C'
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include "freertos/FreeRTOS.h"
          #include "freertos/event_groups.h"
          #include "freertos/task.h"

          #include "cJSON.h"
          #include "driver/i2c_master.h"
          #include "esp_crt_bundle.h"
          #include "esp_event.h"
          #include "esp_http_client.h"
          #include "esp_http_server.h"
          #include "esp_https_ota.h"
          #include "esp_log.h"
          #include "esp_netif.h"
          #include "esp_ota_ops.h"
          #include "esp_system.h"
          #include "esp_wifi.h"
          #include "mdns.h"
          #include "nvs.h"
          #include "nvs_flash.h"

          #include "lvgl.h"
          #include "sunton_esp32_8048s050c.h"

          #ifndef FIRMWARE_BUILD
          #define FIRMWARE_BUILD 0
          #endif

          #ifndef FIRMWARE_VERSION
          #define FIRMWARE_VERSION "0.0.0"
          #endif

          #define SETUP_AP_SSID "BusDisplay-Setup"
          #define SETUP_AP_PASS "esp32ota88"
          #define DEVICE_HOSTNAME "busdisplay"

          #define VERSION_URL \
              "https://colassn.github.io/Testesp32/version.json"
          #define LOCAL_OTA_BUFFER 4096
          #define VERSION_RESPONSE_MAX 2048
          #define CLOUD_CHECK_INTERVAL_MS (5 * 60 * 1000)

          #define WIFI_CONNECTED_BIT BIT0

          static const char *TAG = "bus_display";
          static EventGroupHandle_t wifi_events;
          static httpd_handle_t web_server;
          static TaskHandle_t cloud_task_handle;

          static lv_obj_t *eta_labels[3];
          static lv_obj_t *wifi_status_label;
          static lv_obj_t *cloud_status_label;
          static lv_obj_t *updated_label;
          static int eta_seconds[3] = {180, 660, 1440};
          static uint32_t refresh_count;

          static char saved_ssid[33];
          static char saved_password[65];

          typedef struct {
              int build;
              char version[32];
              char firmware_url[256];
          } cloud_release_t;

          static const char MANAGEMENT_PAGE[] =
              "<!doctype html><html lang='en'><head>"
              "<meta charset='utf-8'>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>Bus Display</title>"
              "<style>"
              ":root{color-scheme:light;--ink:#17222b;--muted:#65717b;"
              "--bg:#eef1f4;--card:#fff;--accent:#c9152b;--green:#167a62}"
              "*{box-sizing:border-box}body{margin:0;background:var(--bg);"
              "font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}"
              "main{max-width:620px;margin:0 auto;padding:22px}"
              "header{padding:10px 2px 18px}h1{font-size:28px;margin:0 0 5px}"
              "p{color:var(--muted);line-height:1.5}"
              ".card{background:var(--card);border-radius:16px;padding:20px;"
              "margin:0 0 16px;box-shadow:0 7px 24px #17222b12}"
              "label{display:block;font-weight:650;margin:13px 0 6px}"
              "input{width:100%;font:inherit;padding:12px;border:1px solid #ccd3d8;"
              "border-radius:10px;background:white}"
              "button{width:100%;font:inherit;font-weight:700;padding:13px;"
              "border:0;border-radius:10px;background:var(--green);color:white;"
              "margin-top:14px}.secondary{background:var(--ink)}"
              ".status{padding:12px;border-radius:10px;background:#edf7f4;"
              "white-space:pre-wrap}.small{font-size:13px}"
              "</style></head><body><main>"
              "<header><h1>Bus Display</h1>"
              "<p>Wi-Fi setup, local recovery update and device status.</p></header>"
              "<section class='card'><h2>Device status</h2>"
              "<div id='status' class='status'>Loading...</div>"
              "<button class='secondary' onclick='checkNow()'>Check cloud update now</button>"
              "</section>"
              "<section class='card'><h2>Home Wi-Fi</h2>"
              "<form method='post' action='/wifi'>"
              "<label>Wi-Fi name (SSID)</label>"
              "<input name='ssid' maxlength='32' required>"
              "<label>Password</label>"
              "<input name='password' type='password' maxlength='64'>"
              "<button type='submit'>Save and restart</button></form>"
              "<p class='small'>The setup hotspot remains available as a recovery path.</p>"
              "</section>"
              "<section class='card'><h2>Local OTA recovery</h2>"
              "<p class='small'>Upload an OTA APP .bin only. Never upload a FULL/merged file here.</p>"
              "<input id='fw' type='file' accept='.bin'>"
              "<button onclick='uploadFirmware()'>Upload and restart</button>"
              "<div id='uploadStatus' class='small'></div></section>"
              "</main><script>"
              "async function refresh(){try{const r=await fetch('/api/status');"
              "const j=await r.json();document.getElementById('status').textContent="
              "`Firmware: ${j.version} (build ${j.build})\\n`+"
              "`Home Wi-Fi: ${j.connected?'connected':'not connected'}\\n`+"
              "`SSID: ${j.ssid||'-'}\\nIP: ${j.ip||'-'}\\n`+"
              "`Cloud manifest: ${j.cloud}`;}catch(e){"
              "document.getElementById('status').textContent='Status unavailable';}}"
              "async function checkNow(){await fetch('/check',{method:'POST'});"
              "document.getElementById('status').textContent='Cloud check requested...';"
              "setTimeout(refresh,2500)}"
              "async function uploadFirmware(){const f=document.getElementById('fw').files[0];"
              "const s=document.getElementById('uploadStatus');if(!f){s.textContent='Choose a .bin first';return;}"
              "if(!confirm('Upload '+f.name+'?'))return;s.textContent='Uploading...';"
              "try{const r=await fetch('/update',{method:'POST',"
              "headers:{'Content-Type':'application/octet-stream'},body:f});"
              "s.textContent=await r.text()}catch(e){s.textContent='The device may be restarting.'}}"
              "refresh();setInterval(refresh,5000);"
              "</script></body></html>";

          static void ui_set_text(lv_obj_t *label, const char *text)
          {
              if (label == NULL) {
                  return;
              }
              lv_lock();
              lv_label_set_text(label, text);
              lv_unlock();
          }

          static void set_card_style(lv_obj_t *obj, uint32_t color)
          {
              lv_obj_set_style_bg_color(obj, lv_color_hex(color), 0);
              lv_obj_set_style_bg_opa(obj, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(obj, 14, 0);
              lv_obj_set_style_border_width(obj, 0, 0);
              lv_obj_set_style_pad_all(obj, 0, 0);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLLABLE);
          }

          static lv_obj_t *make_label(
              lv_obj_t *parent,
              const char *text,
              int x,
              int y,
              const lv_font_t *font,
              uint32_t color)
          {
              lv_obj_t *label = lv_label_create(parent);
              lv_label_set_text(label, text);
              lv_obj_set_pos(label, x, y);
              lv_obj_set_style_text_font(label, font, 0);
              lv_obj_set_style_text_color(label, lv_color_hex(color), 0);
              return label;
          }

          static void format_eta(char *buffer, size_t buffer_size, int seconds)
          {
              if (seconds <= 30) {
                  snprintf(buffer, buffer_size, "DUE");
              } else {
                  snprintf(buffer, buffer_size, "%d min", (seconds + 59) / 60);
              }
          }

          static void update_eta_labels(void)
          {
              char text[32];

              for (int i = 0; i < 3; ++i) {
                  format_eta(text, sizeof(text), eta_seconds[i]);
                  lv_label_set_text(eta_labels[i], text);
              }

              snprintf(text, sizeof(text), "Updated %lus ago",
                       (unsigned long)refresh_count);
              lv_label_set_text(updated_label, text);
          }

          static void eta_timer_cb(lv_timer_t *timer)
          {
              (void)timer;

              for (int i = 0; i < 3; ++i) {
                  eta_seconds[i]--;
              }

              if (eta_seconds[0] < -30) {
                  eta_seconds[0] = eta_seconds[1];
                  eta_seconds[1] = eta_seconds[2];
                  eta_seconds[2] = eta_seconds[1] + 780;
              }

              refresh_count++;
              update_eta_labels();
          }

          static void refresh_clicked(lv_event_t *event)
          {
              (void)event;
              eta_seconds[0] = 180;
              eta_seconds[1] = 660;
              eta_seconds[2] = 1440;
              refresh_count = 0;
              update_eta_labels();

              if (cloud_task_handle != NULL) {
                  xTaskNotifyGive(cloud_task_handle);
              }
          }

