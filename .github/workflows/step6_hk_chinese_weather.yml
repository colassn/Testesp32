              "    button{appearance:none;border:0;border-radius:15px;padding:13px 17px;font:inherit;font-weight:850;color:#061017;background:linear-gradient(135deg,var(--accent),#c3ecff);box-shadow:0 10px 26px #43bce52a;cursor:pointer;transition:.18s transform,.18s filter}\n"
