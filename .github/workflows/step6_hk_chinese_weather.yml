          static esp_err_t parse_hko_current(const char *json_text)
          {
              cJSON *root = cJSON_Parse(json_text); if (!root) return ESP_FAIL;
              int temperature=-1000, humidity=-1, icon=-1;
              cJSON *data = cJSON_GetObjectItemCaseSensitive(cJSON_GetObjectItemCaseSensitive(root,"temperature"),"data");
              cJSON *entry=NULL;
              cJSON_ArrayForEach(entry,data) {
                  cJSON *place=cJSON_GetObjectItemCaseSensitive(entry,"place");
                  cJSON *value=cJSON_GetObjectItemCaseSensitive(entry,"value");
                  if (cJSON_IsString(place)&&cJSON_IsNumber(value)&&strcmp(place->valuestring,weather_station)==0) {temperature=value->valueint;break;}
              }
              cJSON *hdata=cJSON_GetObjectItemCaseSensitive(cJSON_GetObjectItemCaseSensitive(root,"humidity"),"data");
              cJSON *hvalue=cJSON_GetObjectItemCaseSensitive(cJSON_GetArrayItem(hdata,0),"value");
              if(cJSON_IsNumber(hvalue)) humidity=hvalue->valueint;
              cJSON *iv=cJSON_GetArrayItem(cJSON_GetObjectItemCaseSensitive(root,"icon"),0); if(cJSON_IsNumber(iv))icon=iv->valueint;
              if(temperature>-1000) snprintf(current_temp_text,sizeof(current_temp_text),"%d°C",temperature); else strlcpy(current_temp_text,"--°C",sizeof(current_temp_text));
              snprintf(current_condition_text,sizeof(current_condition_text),"而家%s",hko_condition_from_icon_tc(icon));
              if(humidity>=0) snprintf(humidity_text,sizeof(humidity_text),"相對濕度 %d%%",humidity); else strlcpy(humidity_text,"相對濕度暫未有資料",sizeof(humidity_text));

              const char *tip=NULL;
              cJSON *tips=cJSON_GetObjectItemCaseSensitive(root,"specialWxTips");
              cJSON *warnings=cJSON_GetObjectItemCaseSensitive(root,"warningMessage");
              cJSON *first=cJSON_GetArrayItem(tips,0); if(cJSON_IsString(first))tip=first->valuestring;
              if(!tip){first=cJSON_GetArrayItem(warnings,0);if(cJSON_IsString(first))tip=first->valuestring;}
              if(tip) copy_utf8_safe(tip,alert_text,sizeof(alert_text)); else strlcpy(alert_text,"暫時未有特別天氣提示",sizeof(alert_text));

              cJSON *update=cJSON_GetObjectItemCaseSensitive(root,"updateTime");
              if(cJSON_IsString(update)&&strlen(update->valuestring)>=16) snprintf(weather_update_text,sizeof(weather_update_text),"天文台更新：%.5s",update->valuestring+11);
              cJSON_Delete(root); return temperature>-1000?ESP_OK:ESP_FAIL;
          }

