          static void relation_for_date(const char *forecast_date, int index, char *out, size_t out_size)
          {
              time_t now=time(NULL); struct tm local; localtime_r(&now,&local);
              char today[16],tomorrow[16]; strftime(today,sizeof(today),"%Y%m%d",&local);
              now += 24*60*60; localtime_r(&now,&local); strftime(tomorrow,sizeof(tomorrow),"%Y%m%d",&local);
              if(forecast_date && strcmp(forecast_date,today)==0) strlcpy(out,"今日",out_size);
              else if(forecast_date && strcmp(forecast_date,tomorrow)==0) strlcpy(out,"聽日",out_size);
              else strlcpy(out,index==0?"聽日":"後日",out_size);
          }

          static esp_err_t parse_hko_forecast(const char *json_text)
          {
              cJSON *root = cJSON_Parse(json_text);
              if (root == NULL) {
                  return ESP_FAIL;
              }

              cJSON *array =
                  cJSON_GetObjectItemCaseSensitive(root, "weatherForecast");
              if (!cJSON_IsArray(array)) {
                  cJSON_Delete(root);
                  return ESP_FAIL;
              }

              char target_dates[3][16];
              time_t base_time = time(NULL);
              for (int day = 0; day < 3; day++) {
                  struct tm local_time;
                  time_t target_time =
                      base_time + (time_t)day * 24 * 60 * 60;
                  localtime_r(&target_time, &local_time);
                  strftime(
                      target_dates[day],
                      sizeof(target_dates[day]),
                      "%Y%m%d",
                      &local_time);
              }

              bool found_today = false;
              bool found_future[2] = {false, false};
              cJSON *item = NULL;

              cJSON_ArrayForEach(item, array) {
                  cJSON *date =
                      cJSON_GetObjectItemCaseSensitive(item, "forecastDate");
                  if (!cJSON_IsString(date)) {
                      continue;
                  }

                  cJSON *minimum =
                      cJSON_GetObjectItemCaseSensitive(
                          cJSON_GetObjectItemCaseSensitive(
                              item,
                              "forecastMintemp"),
                          "value");
                  cJSON *maximum =
                      cJSON_GetObjectItemCaseSensitive(
                          cJSON_GetObjectItemCaseSensitive(
                              item,
                              "forecastMaxtemp"),
                          "value");

                  if (strcmp(date->valuestring, target_dates[0]) == 0 &&
                      cJSON_IsNumber(minimum) &&
                      cJSON_IsNumber(maximum)) {
                      snprintf(
                          today_range_text,
                          sizeof(today_range_text),
                          "本港今日 %d–%d°C",
                          minimum->valueint,
                          maximum->valueint);
                      found_today = true;
                      continue;
                  }

                  int future_index = -1;
                  if (strcmp(date->valuestring, target_dates[1]) == 0) {
                      future_index = 0;
                  } else if (strcmp(date->valuestring, target_dates[2]) == 0) {
                      future_index = 1;
                  }
                  if (future_index < 0) {
                      continue;
                  }

                  cJSON *week =
                      cJSON_GetObjectItemCaseSensitive(item, "week");
                  cJSON *weather =
                      cJSON_GetObjectItemCaseSensitive(item, "forecastWeather");
                  cJSON *psr =
                      cJSON_GetObjectItemCaseSensitive(item, "PSR");

                  char short_weather[128];
                  copy_first_sentence(
                      cJSON_IsString(weather) ? weather->valuestring : NULL,
                      short_weather,
                      sizeof(short_weather));

                  snprintf(
                      forecast_text[future_index],
                      sizeof(forecast_text[future_index]),
                      "%s %s　%d–%d°C｜落雨風險%s\\n%s",
                      future_index == 0 ? "聽日" : "後日",
                      cJSON_IsString(week) ? week->valuestring : "",
                      cJSON_IsNumber(minimum) ? minimum->valueint : 0,
                      cJSON_IsNumber(maximum) ? maximum->valueint : 0,
                      cJSON_IsString(psr) ? psr->valuestring : "—",
                      short_weather);
                  found_future[future_index] = true;
              }

              if (!found_today) {
                  strlcpy(
                      today_range_text,
                      "本港今日溫度範圍暫未有資料",
                      sizeof(today_range_text));
              }
              if (!found_future[0]) {
                  strlcpy(
                      forecast_text[0],
                      "聽日預報暫時攞唔到",
                      sizeof(forecast_text[0]));
              }
              if (!found_future[1]) {
                  strlcpy(
                      forecast_text[1],
                      "後日預報暫時攞唔到",
                      sizeof(forecast_text[1]));
              }

              cJSON_Delete(root);
              return found_future[0] || found_future[1]
                  ? ESP_OK
                  : ESP_FAIL;
          }

          static esp_err_t parse_hourly_rainfall(const char *json_text)
          {
              cJSON *root=cJSON_Parse(json_text); if(!root)return ESP_FAIL;
              const weather_location_t *location=find_weather_location(weather_station);
              cJSON *array=cJSON_GetObjectItemCaseSensitive(root,"hourlyRainfall"); cJSON *entry=NULL; const char *rain=NULL;
              cJSON_ArrayForEach(entry,array){cJSON *station=cJSON_GetObjectItemCaseSensitive(entry,"automaticWeatherStation");cJSON *value=cJSON_GetObjectItemCaseSensitive(entry,"value");if(cJSON_IsString(station)&&cJSON_IsString(value)&&strcmp(station->valuestring,location->rain_station)==0){rain=value->valuestring;break;}}
              if(rain&&strcmp(rain,"M")!=0) snprintf(rainfall_text,sizeof(rainfall_text),"過去一小時雨量 %s 毫米",rain); else strlcpy(rainfall_text,"過去一小時雨量暫未有資料",sizeof(rainfall_text));
              cJSON_Delete(root); return rain?ESP_OK:ESP_FAIL;
          }

          static esp_err_t parse_sunrise_sunset(const char *json_text)
          {
              cJSON *root=cJSON_Parse(json_text); if(!root)return ESP_FAIL;
              cJSON *data=cJSON_GetObjectItemCaseSensitive(root,"data"); cJSON *row=cJSON_GetArrayItem(data,0);
              cJSON *sunrise=cJSON_GetArrayItem(row,1); cJSON *sunset=cJSON_GetArrayItem(row,3);
              bool valid = cJSON_IsString(sunrise) && cJSON_IsString(sunset);
              if(valid) {
                  snprintf(sunrise_text,sizeof(sunrise_text),"日出 %s　日落 %s",sunrise->valuestring,sunset->valuestring);
              } else {
                  strlcpy(sunrise_text,"日出日落資料暫未有",sizeof(sunrise_text));
              }
              cJSON_Delete(root);
              return valid ? ESP_OK : ESP_FAIL;
          }

          typedef struct {
              char line[192]; size_t line_length;
              double target_lat,target_lon;
              char endings[NOWCAST_SLOT_COUNT][16];
              double rainfall[NOWCAST_SLOT_COUNT];
              double best_distance[NOWCAST_SLOT_COUNT];
              int slots;
          } nowcast_context_t;

          static void nowcast_process_line(nowcast_context_t *ctx, const char *line)
          {
              char updated[16],ending[16]; double lat,lon,rain;
              if(sscanf(line,"%15[^,],%15[^,],%lf,%lf,%lf",updated,ending,&lat,&lon,&rain)!=5||!isdigit((unsigned char)updated[0]))return;
              int slot=-1; for(int i=0;i<ctx->slots;i++)if(strcmp(ctx->endings[i],ending)==0){slot=i;break;}
              if(slot<0&&ctx->slots<NOWCAST_SLOT_COUNT){slot=ctx->slots++;strlcpy(ctx->endings[slot],ending,sizeof(ctx->endings[slot]));ctx->best_distance[slot]=1e9;}
              if(slot<0)return;
              double dlat=lat-ctx->target_lat; double dlon=(lon-ctx->target_lon)*0.92; double distance=dlat*dlat+dlon*dlon;
              if(distance<ctx->best_distance[slot]){ctx->best_distance[slot]=distance;ctx->rainfall[slot]=rain;}
          }

          static esp_err_t nowcast_event_handler(esp_http_client_event_t *event)
          {
              nowcast_context_t *ctx=event->user_data;
              if(event->event_id!=HTTP_EVENT_ON_DATA||!ctx||event->data_len<=0)return ESP_OK;
              const char *data=event->data;
              for(int i=0;i<event->data_len;i++){
                  char c=data[i]; if(c=='\r')continue;
                  if(c=='\n'){ctx->line[ctx->line_length]='\0';nowcast_process_line(ctx,ctx->line);ctx->line_length=0;}
                  else if(ctx->line_length+1<sizeof(ctx->line))ctx->line[ctx->line_length++]=c;
              }
              return ESP_OK;
          }

          static esp_err_t fetch_rain_nowcast(void)
          {
              const weather_location_t *location=find_weather_location(weather_station);
              nowcast_context_t ctx={.target_lat=location->latitude,.target_lon=location->longitude,.slots=0};
              for(int i=0;i<NOWCAST_SLOT_COUNT;i++)ctx.best_distance[i]=1e9;
              esp_http_client_config_t config={.url=HKO_NOWCAST_URL,.event_handler=nowcast_event_handler,.user_data=&ctx,.timeout_ms=45000,.buffer_size=4096,.buffer_size_tx=512,.crt_bundle_attach=esp_crt_bundle_attach,.keep_alive_enable=true};
              esp_http_client_handle_t client=esp_http_client_init(&config); if(!client)return ESP_FAIL;
              esp_err_t error=esp_http_client_perform(client); int status=esp_http_client_get_status_code(client); esp_http_client_cleanup(client);
              if(ctx.line_length){ctx.line[ctx.line_length]='\0';nowcast_process_line(&ctx,ctx.line);}
              if(error!=ESP_OK||status!=200||ctx.slots==0)return ESP_FAIL;
              for(int i=0;i<ctx.slots-1;i++)for(int j=i+1;j<ctx.slots;j++)if(strcmp(ctx.endings[i],ctx.endings[j])>0){char t[16];strlcpy(t,ctx.endings[i],sizeof(t));strlcpy(ctx.endings[i],ctx.endings[j],sizeof(ctx.endings[i]));strlcpy(ctx.endings[j],t,sizeof(ctx.endings[j]));double r=ctx.rainfall[i];ctx.rainfall[i]=ctx.rainfall[j];ctx.rainfall[j]=r;}
              double total=0;for(int i=0;i<ctx.slots;i++)total+=ctx.rainfall[i];
              if(total<0.1)strlcpy(nowcast_summary_text,"未來兩個鐘暫時唔似會落雨",sizeof(nowcast_summary_text));
              else if(total<2.0)strlcpy(nowcast_summary_text,"可能有幾滴雨，帶把遮穩陣",sizeof(nowcast_summary_text));
              else if(total<10.0)strlcpy(nowcast_summary_text,"有機會有驟雨，出街記得帶遮",sizeof(nowcast_summary_text));
              else strlcpy(nowcast_summary_text,"未來兩個鐘雨勢可能較大，要留意",sizeof(nowcast_summary_text));
              double r[4]={0,0,0,0};for(int i=0;i<ctx.slots&&i<4;i++)r[i]=ctx.rainfall[i];
              snprintf(nowcast_detail_text,sizeof(nowcast_detail_text),"30分鐘 %.1f｜60分鐘 %.1f 毫米\n90分鐘 %.1f｜120分鐘 %.1f 毫米",r[0],r[1],r[2],r[3]);
              return ESP_OK;
          }

          static void weather_task(void *argument)
          {
              (void)argument; weather_task_handle=xTaskGetCurrentTaskHandle();
              for(;;){
                  xEventGroupWaitBits(wifi_events,WIFI_CONNECTED_BIT,pdFALSE,pdTRUE,portMAX_DELAY);
                  strlcpy(current_condition_text,"重新攞緊天文台資料…",sizeof(current_condition_text));
                  strlcpy(weather_update_text,"連線去香港天文台…",sizeof(weather_update_text)); refresh_weather_labels();
                  char *current=NULL,*forecast=NULL,*local=NULL,*hourly=NULL,*sun=NULL;
                  esp_err_t rc=hko_http_get(HKO_CURRENT_URL,&current);
                  esp_err_t rf=hko_http_get(HKO_FORECAST_URL,&forecast);
                  esp_err_t rl=hko_http_get(HKO_LOCAL_FORECAST_URL,&local);
                  esp_err_t rr=hko_http_get(HKO_HOURLY_RAIN_URL,&hourly);
                  char sun_url[256]; time_t now=time(NULL); struct tm tm_now; localtime_r(&now,&tm_now);
                  snprintf(sun_url,sizeof(sun_url),"https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=SRS&rformat=json&year=%d&month=%d&day=%d",tm_now.tm_year+1900,tm_now.tm_mon+1,tm_now.tm_mday);
                  esp_err_t rs=hko_http_get(sun_url,&sun);
                  if (rc == ESP_OK) { rc = parse_hko_current(current); }
                  if (rf == ESP_OK) { rf = parse_hko_forecast(forecast); }
                  if (rl == ESP_OK) { rl = parse_hko_local_forecast(local); }
                  if (rr == ESP_OK) { rr = parse_hourly_rainfall(hourly); }
                  if (rs == ESP_OK) { rs = parse_sunrise_sunset(sun); }
                  esp_err_t rn=fetch_rain_nowcast();
                  free(current);free(forecast);free(local);free(hourly);free(sun);
                  if(rc!=ESP_OK)strlcpy(current_condition_text,"即時天氣暫時攞唔到",sizeof(current_condition_text));
                  if(rf!=ESP_OK){strlcpy(forecast_text[0],"聽日預報暫時攞唔到",sizeof(forecast_text[0]));strlcpy(forecast_text[1],"後日預報暫時攞唔到",sizeof(forecast_text[1]));}
                  if(rr!=ESP_OK)strlcpy(rainfall_text,"過去一小時雨量暫未有資料",sizeof(rainfall_text));
                  if(rs!=ESP_OK)strlcpy(sunrise_text,"日出日落資料暫未有",sizeof(sunrise_text));
                  if(rn!=ESP_OK){strlcpy(nowcast_summary_text,"未來兩個鐘雨勢暫時攞唔到",sizeof(nowcast_summary_text));strlcpy(nowcast_detail_text,"請稍後再試，或者檢查網絡",sizeof(nowcast_detail_text));}
                  refresh_weather_labels(); ulTaskNotifyTake(pdTRUE,pdMS_TO_TICKS(HKO_REFRESH_MS));
              }
          }

          static void install_hko_dashboard_once(void)
          {
              nvs_handle_t handle;
              uint8_t installed = 0;

              if (nvs_open(
                      "display_cfg",
                      NVS_READWRITE,
                      &handle) != ESP_OK) {
                  return;
              }

              nvs_get_u8(handle, "hko_dash_v3", &installed);

              if (installed != 1 &&
                  write_display_html(
                      DEFAULT_DISPLAY_HTML,
                      strlen(DEFAULT_DISPLAY_HTML)) == ESP_OK) {
                  nvs_set_u8(handle, "hko_dash_v3", 1);
                  nvs_commit(handle);
              }

              nvs_close(handle);
          }

