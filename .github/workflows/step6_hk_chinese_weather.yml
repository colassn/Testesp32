          static void stopwatch_toggle_clicked(lv_event_t *event)
          {
              (void)event;

              int64_t now = esp_timer_get_time();

              if (stopwatch_running) {
                  stopwatch_accumulated_us +=
                      now - stopwatch_started_us;
                  stopwatch_running = false;
              } else {
                  stopwatch_started_us = now;
                  stopwatch_running = true;
              }
          }

          static void stopwatch_reset_clicked(lv_event_t *event)
          {
              (void)event;
              stopwatch_running = false;
              stopwatch_accumulated_us = 0;
              stopwatch_started_us = 0;
          }

          static void create_button(
              lv_obj_t *screen,
              const char *html,
              const char *action,
              const char *default_text,
              html_style_t defaults,
              lv_event_cb_t callback)
          {
              const char *element =
                  find_element(html, "data-action", action);

              if (element == NULL) {
                  return;
              }

              html_style_t style =
                  read_style(element, defaults);

              if (style.hidden) {
                  return;
              }

              char text[64];
              if (!extract_inner_text(
                      element, text, sizeof(text)) ||
                  text[0] == '\0') {
                  strlcpy(text, default_text, sizeof(text));
              }

              lv_obj_t *button = lv_button_create(screen);
              lv_obj_set_pos(button, style.x, style.y);
              lv_obj_set_size(
                  button, style.width, style.height);
              lv_obj_set_style_bg_color(
                  button,
                  lv_color_hex(active_bg_color(&style)),
                  0);
              lv_obj_set_style_radius(
                  button, style.radius, 0);
              lv_obj_set_style_border_width(
                  button, 0, 0);
              lv_obj_add_event_cb(
                  button, callback, LV_EVENT_CLICKED, NULL);

              lv_obj_t *label = lv_label_create(button);
              lv_label_set_text(label, text);
              lv_obj_set_style_text_font(
                  label, font_for_element(element, text, style.font_size), 0);
              lv_obj_set_style_text_color(
                  label,
                  lv_color_hex(active_text_color(&style)),
                  0);
              lv_obj_center(label);
          }

          static lv_obj_t *create_widget_label(
              lv_obj_t *screen,
              const char *html,
              const char *widget,
              const char *default_text,
              html_style_t defaults)
          {
              const char *element =
                  find_element(html, "data-widget", widget);

              if (element == NULL) {
                  return NULL;
              }

              html_style_t style =
                  read_style(element, defaults);
              char text[256];

              if (!extract_inner_text(
                      element, text, sizeof(text)) ||
                  text[0] == '\0' ||
                  strstr(text, "{{") != NULL) {
                  strlcpy(text, default_text, sizeof(text));
              }

              return create_label(screen, text, &style, element);
          }

          static void create_box_widget(
              lv_obj_t *screen,
              const char *html,
              const char *widget,
              html_style_t defaults)
          {
              const char *element = find_element(html, "data-widget", widget);
              if (element == NULL) return;
