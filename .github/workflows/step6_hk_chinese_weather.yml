name: STEP 6 - 香港全中文天氣時鐘

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone proven display project
        run: git clone --depth 1 https://github.com/mr-sven/esp32-8048S050C.git project

      - name: Install Hong Kong Chinese fonts
        shell: bash
        run: |
          set -e
          export NODE_OPTIONS=--max-old-space-size=8192
          curl -L --fail --retry 3 -o NotoSansCJKhk-Regular.otf             https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChineseHK/NotoSansCJKhk-Regular.otf
          npx --yes lv_font_conv@1.5.3 --font NotoSansCJKhk-Regular.otf             -r "0x20-0x7E,0x2E80-0x2EFF,0x2F00-0x2FDF,0x3000-0x303F,0x31C0-0x31EF,0x3400-0x4DBF,0x4E00-0x9FFF,0xF900-0xFAFF,0xFE30-0xFE4F,0xFF00-0xFFEF"             --size 18 --format lvgl --bpp 1 --no-kerning --no-compress -o project/main/hk_cjk_18.c
          printf '%s' '一中九乾京今仙低來個備元光全兩公冷出分勢去可台啟園地坑城埔埗塘士多大天家密寒將對小屯山嶺已度後微德打文料新日時晴暫暴更朗期未本柏柱校毫氣水沙洲流浮涼深淺清測港準潮澳濕灣炎煙熱燥田相督短竹等筲箕米絡網緊線美而聽色荃落薄衣西觀角谷貢資赤跑軍連過道部酷量鐘長門間陽險雨雲雷霞霧青預頗風香馬驟高鱲黃點鼓龍' > font_ui_symbols.txt
          npx --yes lv_font_conv@1.5.3 --font NotoSansCJKhk-Regular.otf             -r "0x20-0x7E,0x00B0,0x2013,0x30FB"             --symbols "$(cat font_ui_symbols.txt)"             --size 26 --format lvgl --bpp 2 --no-kerning --no-compress -o project/main/hk_ui_26.c
          npx --yes lv_font_conv@1.5.3 --font NotoSansCJKhk-Regular.otf             --symbols "0123456789:" --size 72 --format lvgl --bpp 2 --no-kerning --no-compress -o project/main/hk_digits_72.c
          npx --yes lv_font_conv@1.5.3 --font NotoSansCJKhk-Regular.otf             --symbols "0123456789.-–°C%" --size 56 --format lvgl --bpp 2 --no-kerning --no-compress -o project/main/hk_temp_56.c

      - name: Add Chinese dashboard firmware
        shell: bash
        run: |
          cat > project/main/main.c <<'MAIN_C'

          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <strings.h>
          #include <sys/time.h>
          #include <time.h>
          #include <ctype.h>
          #include <unistd.h>
          #include <math.h>

          #include "freertos/FreeRTOS.h"
          #include "freertos/event_groups.h"
          #include "freertos/task.h"

          #include "driver/i2c_master.h"
          #include "esp_event.h"
          #include "esp_http_server.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "cJSON.h"
          #include "esp_netif.h"
          #include "esp_netif_sntp.h"
          #include "esp_ota_ops.h"
          #include "esp_spiffs.h"
          #include "esp_system.h"
          #include "esp_timer.h"
          #include "esp_wifi.h"
          #include "nvs.h"
          #include "nvs_flash.h"

          #include "lvgl.h"
          #include "sunton_esp32_8048s050c.h"

          LV_FONT_DECLARE(hk_cjk_18);
          LV_FONT_DECLARE(hk_ui_26);
          LV_FONT_DECLARE(hk_digits_72);
          LV_FONT_DECLARE(hk_temp_56);

          #define SETUP_AP_SSID "ESP32-Display-OTA"
          #define SETUP_AP_PASS "esp32ota88"
          #define WIFI_CONNECTED_BIT BIT0
          #define LOCAL_OTA_BUFFER 4096
          #define DISPLAY_HTML_MAX 16384
          #define DISPLAY_HTML_PATH "/spiffs/display.html"
          #define DISPLAY_HTML_TEMP_PATH "/spiffs/display.tmp"
          #define HKO_CURRENT_URL "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc"
          #define HKO_FORECAST_URL "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc"
          #define HKO_LOCAL_FORECAST_URL "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc"
          #define HKO_HOURLY_RAIN_URL "https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=tc"
          #define HKO_NOWCAST_URL "https://data.weather.gov.hk/weatherAPI/hko_data/F3/Gridded_rainfall_nowcast.csv"
          #define HKO_HTTP_MAX 65536
          #define HKO_REFRESH_MS (12 * 60 * 1000)
          #define NOWCAST_SLOT_COUNT 4

