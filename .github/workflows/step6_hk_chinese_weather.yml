          static void copy_utf8_safe(const char *source, char *destination, size_t size)
          {
              if (size == 0) return;
              destination[0] = '\0';
              if (source == NULL) return;
              size_t in = 0, out = 0;
              while (source[in] && out + 1 < size) {
                  unsigned char c = (unsigned char)source[in];
                  size_t bytes = c < 0x80 ? 1 : ((c & 0xE0) == 0xC0 ? 2 : ((c & 0xF0) == 0xE0 ? 3 : 4));
                  if (out + bytes >= size) break;
                  for (size_t j=0;j<bytes && source[in+j];j++) destination[out++] = source[in+j];
                  in += bytes;
              }
              destination[out] = '\0';
          }

          static void copy_first_sentence(const char *source, char *destination, size_t size)
          {
              if (source == NULL) { copy_utf8_safe("暫未有詳細預報",destination,size); return; }
              const char *stop = strstr(source, "。");
              if (stop == NULL) { copy_utf8_safe(source,destination,size); return; }
              size_t length = (size_t)(stop - source) + strlen("。");
              if (length >= size) length = size - 1;
              memcpy(destination, source, length);
              destination[length] = '\0';
          }

          static bool extract_two_temperatures(const char *text, int *minimum, int *maximum)
          {
              if (!text || !minimum || !maximum) return false;
              const char *p = strstr(text, "氣溫介乎");
              if (!p) p = text;
              int values[2] = {-1000,-1000}; int count = 0;
              while (*p && count < 2) {
                  if (*p >= '0' && *p <= '9') {
                      char *end_pointer = NULL;
                      values[count++] = (int)strtol(p, &end_pointer, 10);
                      p = end_pointer;
                  } else {
                      p++;
                  }
              }
              if (count == 2) { *minimum=values[0]; *maximum=values[1]; return true; }
              return false;
          }

