              "  <title>香港天氣時鐘設定</title>\n"
              "  <style>\n"
              "    :root{--ink:#f5f8fa;--muted:#a9bac5;--card:#13212bbd;--line:#ffffff18;--accent:#83d8ff;--accent2:#b9a6ff;--danger:#ff8a9a}\n"
