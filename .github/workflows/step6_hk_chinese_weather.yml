          static uint32_t parse_hex_color(const char *text, uint32_t fallback)
          {
              if (text == NULL || text[0] != '#' || strlen(text) < 7) {
                  return fallback;
              }

              char value[7];
              memcpy(value, text + 1, 6);
              value[6] = '\0';
              return (uint32_t)strtoul(value, NULL, 16);
          }

          static bool extract_attribute(
              const char *element,
              const char *name,
              char *output,
              size_t output_size)
          {
              if (element == NULL || output == NULL || output_size == 0) {
                  return false;
              }

              const char *tag_end = strchr(element, '>');
              if (tag_end == NULL) {
                  return false;
              }

              const char *cursor = element;
              size_t name_length = strlen(name);

              while ((cursor = strstr(cursor, name)) != NULL && cursor < tag_end) {
                  const char *after_name = cursor + name_length;

                  while (after_name < tag_end &&
                         (*after_name == ' ' || *after_name == '\t')) {
                      after_name++;
                  }

                  if (after_name >= tag_end || *after_name != '=') {
                      cursor += name_length;
                      continue;
                  }

                  after_name++;
                  while (after_name < tag_end &&
                         (*after_name == ' ' || *after_name == '\t')) {
                      after_name++;
                  }

                  if (after_name >= tag_end ||
                      (*after_name != '"' && *after_name != '\'')) {
                      return false;
                  }

                  char quote = *after_name++;
                  const char *value_end = after_name;

                  while (value_end < tag_end && *value_end != quote) {
                      value_end++;
                  }

                  if (value_end >= tag_end) {
                      return false;
                  }

                  size_t length = (size_t)(value_end - after_name);
                  if (length >= output_size) {
                      length = output_size - 1;
                  }

                  memcpy(output, after_name, length);
                  output[length] = '\0';
                  return true;
              }

              return false;
          }

          static const char *find_element(
              const char *html,
              const char *attribute,
              const char *value)
          {
              char double_pattern[96];
              char single_pattern[96];

              snprintf(
                  double_pattern,
                  sizeof(double_pattern),
                  "%s=\"%s\"",
                  attribute,
                  value);
              snprintf(
                  single_pattern,
                  sizeof(single_pattern),
                  "%s='%s'",
                  attribute,
                  value);

              const char *marker = strstr(html, double_pattern);
              if (marker == NULL) {
                  marker = strstr(html, single_pattern);
              }
              if (marker == NULL) {
                  return NULL;
              }

              const char *start = marker;
              while (start > html && *start != '<') {
                  start--;
              }

              return *start == '<' ? start : NULL;
          }

          static bool extract_inner_text(
              const char *element,
              char *output,
              size_t output_size)
          {
              if (element == NULL || output_size == 0) {
                  return false;
              }

              const char *start = strchr(element, '>');
              if (start == NULL) {
                  return false;
              }
              start++;

              const char *end = strchr(start, '<');
              if (end == NULL) {
                  return false;
              }

              while (start < end &&
                     (*start == ' ' || *start == '\t' ||
                      *start == '\r' || *start == '\n')) {
                  start++;
              }
              while (end > start &&
                     (end[-1] == ' ' || end[-1] == '\t' ||
                      end[-1] == '\r' || end[-1] == '\n')) {
                  end--;
              }

              size_t length = (size_t)(end - start);
              if (length >= output_size) {
                  length = output_size - 1;
              }

              memcpy(output, start, length);
              output[length] = '\0';
              return true;
          }

          static bool extract_css_value(
              const char *style,
              const char *property,
              char *output,
              size_t output_size)
          {
              if (style == NULL || output_size == 0) {
                  return false;
              }

              size_t property_length = strlen(property);
              const char *cursor = style;

              while ((cursor = strstr(cursor, property)) != NULL) {
                  bool valid_start =
                      cursor == style ||
                      cursor[-1] == ';' ||
                      cursor[-1] == ' ' ||
                      cursor[-1] == '\t';

                  const char *after = cursor + property_length;
                  while (*after == ' ' || *after == '\t') {
                      after++;
                  }

                  if (!valid_start || *after != ':') {
                      cursor += property_length;
                      continue;
                  }

                  after++;
                  while (*after == ' ' || *after == '\t') {
                      after++;
                  }

                  const char *end = strchr(after, ';');
                  if (end == NULL) {
                      end = after + strlen(after);
                  }

                  while (end > after &&
                         (end[-1] == ' ' || end[-1] == '\t')) {
                      end--;
                  }

                  size_t length = (size_t)(end - after);
                  if (length >= output_size) {
                      length = output_size - 1;
                  }

                  memcpy(output, after, length);
                  output[length] = '\0';
                  return true;
              }

              return false;
          }

          static int css_integer(
              const char *style,
              const char *property,
              int fallback)
          {
              char value[32];

              if (!extract_css_value(
                      style, property, value, sizeof(value))) {
                  return fallback;
              }

              return atoi(value);
          }

          static bool css_hidden(const char *style)
          {
              char value[32];

              if (!extract_css_value(
                      style, "display", value, sizeof(value))) {
                  return false;
              }

              return strcasecmp(value, "none") == 0;
          }

          static lv_text_align_t css_alignment(
              const char *style,
              lv_text_align_t fallback)
          {
              char value[32];

              if (!extract_css_value(
                      style, "text-align", value, sizeof(value))) {
                  return fallback;
              }

              if (strcasecmp(value, "center") == 0) {
                  return LV_TEXT_ALIGN_CENTER;
              }
              if (strcasecmp(value, "right") == 0) {
                  return LV_TEXT_ALIGN_RIGHT;
              }
              return LV_TEXT_ALIGN_LEFT;
          }

          static const lv_font_t *font_for_size(int size)
          {
              if (size >= 44) return &lv_font_montserrat_48;
              if (size >= 34) return &lv_font_montserrat_36;
              if (size >= 30) return &lv_font_montserrat_32;
              if (size >= 24) return &lv_font_montserrat_28;
              if (size >= 17) return &lv_font_montserrat_20;
              return &lv_font_montserrat_14;
          }

          static bool contains_non_ascii(const char *text)
          {
              if (text == NULL) return false;
              while (*text) {
                  if ((unsigned char)*text >= 0x80) return true;
                  text++;
              }
              return false;
          }

          static const lv_font_t *font_for_element(
              const char *element,
              const char *text,
              int size)
          {
              char kind[24] = "";
              if (element != NULL) {
                  extract_attribute(element, "data-font", kind, sizeof(kind));
              }
              if (strcmp(kind, "digits") == 0) return &hk_digits_72;
              if (strcmp(kind, "temp") == 0) return &hk_temp_56;
              if (strcmp(kind, "ui") == 0) return &hk_ui_26;
              if (strcmp(kind, "cjk") == 0 || contains_non_ascii(text)) return &hk_cjk_18;
              return font_for_size(size);
          }

          static html_style_t read_style(
              const char *element,
              html_style_t defaults)
          {
              char style[512] = "";
              char value[32];

              if (element != NULL) {
                  extract_attribute(
                      element, "style", style, sizeof(style));

                  defaults.x =
                      css_integer(style, "left", defaults.x);
                  defaults.y =
                      css_integer(style, "top", defaults.y);
                  defaults.width =
                      css_integer(style, "width", defaults.width);
                  defaults.height =
                      css_integer(style, "height", defaults.height);
                  defaults.font_size =
                      css_integer(style, "font-size", defaults.font_size);
                  defaults.radius =
                      css_integer(style, "border-radius", defaults.radius);
                  defaults.align =
                      css_alignment(style, defaults.align);
                  defaults.hidden = css_hidden(style);

                  if (extract_attribute(
                          element,
                          "data-light-color",
                          value,
                          sizeof(value))) {
                      defaults.light_color =
                          parse_hex_color(value, defaults.light_color);
                  }
                  if (extract_attribute(
                          element,
                          "data-dark-color",
                          value,
                          sizeof(value))) {
                      defaults.dark_color =
                          parse_hex_color(value, defaults.dark_color);
                  }
                  if (extract_attribute(
                          element,
                          "data-light-bg",
                          value,
                          sizeof(value))) {
                      defaults.light_bg =
                          parse_hex_color(value, defaults.light_bg);
                  }
                  if (extract_attribute(
                          element,
                          "data-dark-bg",
                          value,
                          sizeof(value))) {
                      defaults.dark_bg =
                          parse_hex_color(value, defaults.dark_bg);
                  }
              }

              return defaults;
          }

          static uint32_t active_text_color(const html_style_t *style)
          {
              return dark_mode ? style->dark_color : style->light_color;
          }

          static uint32_t active_bg_color(const html_style_t *style)
          {
              return dark_mode ? style->dark_bg : style->light_bg;
          }

          static void style_box(
              lv_obj_t *object,
              uint32_t color,
              int radius)
          {
              lv_obj_set_style_bg_color(
                  object, lv_color_hex(color), 0);
              lv_obj_set_style_bg_opa(
                  object, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(
                  object, radius, 0);
              lv_obj_set_style_border_width(
                  object, 0, 0);
              lv_obj_set_style_pad_all(
                  object, 0, 0);
              lv_obj_clear_flag(
                  object, LV_OBJ_FLAG_SCROLLABLE);
          }

          static lv_obj_t *create_label(
              lv_obj_t *parent,
              const char *text,
              const html_style_t *style,
              const char *element)
          {
              if (style->hidden) return NULL;

              lv_obj_t *label = lv_label_create(parent);
              lv_label_set_text(label, text);
              lv_obj_set_pos(label, style->x, style->y);
              lv_obj_set_width(label, style->width);
              lv_obj_set_height(label, style->height);
              lv_obj_set_style_text_font(
                  label,
                  font_for_element(element, text, style->font_size),
                  0);
              lv_obj_set_style_text_color(label, lv_color_hex(active_text_color(style)), 0);
              lv_obj_set_style_text_align(label, style->align, 0);

              char scroll_value[12] = "";
              if (element != NULL &&
                  extract_attribute(element, "data-scroll", scroll_value, sizeof(scroll_value)) &&
                  strcasecmp(scroll_value, "true") == 0) {
                  lv_label_set_long_mode(label, LV_LABEL_LONG_SCROLL_CIRCULAR);
              } else {
                  lv_label_set_long_mode(label, LV_LABEL_LONG_CLIP);
              }
              return label;
          }

          static bool clock_is_valid(void)
          {
              return time(NULL) >= 1735689600;
          }

          static int64_t stopwatch_elapsed_now(void)
          {
              if (!stopwatch_running) {
                  return stopwatch_accumulated_us;
              }

              return stopwatch_accumulated_us +
                     (esp_timer_get_time() - stopwatch_started_us);
          }

          static void save_theme_preference(void)
          {
              nvs_handle_t handle;

              if (nvs_open(
                      "display_cfg",
                      NVS_READWRITE,
                      &handle) != ESP_OK) {
                  return;
              }

              nvs_set_u8(handle, "dark", dark_mode ? 1 : 0);
              nvs_commit(handle);
              nvs_close(handle);
          }

