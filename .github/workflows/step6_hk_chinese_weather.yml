          static void clock_timer_cb(lv_timer_t *timer)
          {
              (void)timer;
              if (clock_is_valid()) {
                  struct timeval now;
                  struct tm local_time;
                  char clock_buffer[16];
                  char date_buffer[96];
                  static const char *weekdays[] = {"星期日","星期一","星期二","星期三","星期四","星期五","星期六"};
                  gettimeofday(&now, NULL);
                  localtime_r(&now.tv_sec, &local_time);
                  strftime(clock_buffer, sizeof(clock_buffer), "%H:%M:%S", &local_time);
                  snprintf(date_buffer,sizeof(date_buffer),"%d年%d月%d日　%s",local_time.tm_year+1900,local_time.tm_mon+1,local_time.tm_mday,weekdays[local_time.tm_wday]);
                  if (clock_label) lv_label_set_text(clock_label, clock_buffer);
                  if (date_label) lv_label_set_text(date_label, date_buffer);
              } else {
                  if (clock_label) lv_label_set_text(clock_label, "--:--:--");
                  if (date_label) lv_label_set_text(date_label, "等緊網絡校時");
              }
          }

          static esp_err_t initialise_nvs(void)
          {
              esp_err_t error = nvs_flash_init();

              if (error == ESP_ERR_NVS_NO_FREE_PAGES ||
                  error == ESP_ERR_NVS_NEW_VERSION_FOUND) {
                  ESP_ERROR_CHECK(nvs_flash_erase());
                  error = nvs_flash_init();
              }

              return error;
          }

          static esp_err_t initialise_spiffs(void)
          {
              esp_vfs_spiffs_conf_t configuration = {
                  .base_path = "/spiffs",
                  .partition_label = "storage",
                  .max_files = 5,
                  .format_if_mount_failed = true,
              };

              return esp_vfs_spiffs_register(&configuration);
          }

          static void load_wifi_credentials(void)
          {
              nvs_handle_t handle;
              size_t ssid_length = sizeof(saved_ssid);
              size_t password_length = sizeof(saved_password);

              saved_ssid[0] = '\0';
              saved_password[0] = '\0';

              if (nvs_open(
                      "wifi_cfg",
                      NVS_READONLY,
                      &handle) != ESP_OK) {
                  return;
              }

              if (nvs_get_str(
                      handle,
                      "ssid",
                      saved_ssid,
                      &ssid_length) != ESP_OK) {
                  saved_ssid[0] = '\0';
              }

              if (nvs_get_str(
                      handle,
                      "password",
                      saved_password,
                      &password_length) != ESP_OK) {
                  saved_password[0] = '\0';
              }

              nvs_close(handle);
          }

          static esp_err_t save_wifi_credentials(
              const char *ssid,
              const char *password)
          {
              nvs_handle_t handle;
              esp_err_t error =
                  nvs_open(
                      "wifi_cfg",
                      NVS_READWRITE,
                      &handle);

              if (error != ESP_OK) {
                  return error;
              }

              error = nvs_set_str(handle, "ssid", ssid);
              if (error == ESP_OK) {
                  error =
                      nvs_set_str(
                          handle, "password", password);
              }
              if (error == ESP_OK) {
                  error = nvs_commit(handle);
              }

              nvs_close(handle);
              return error;
          }

