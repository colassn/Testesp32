              "    body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,\"PingFang HK\",\"Noto Sans TC\",sans-serif;background:radial-gradient(circle at 15% 0%,#173647 0,transparent 38%),radial-gradient(circle at 90% 8%,#2e2350 0,transparent 36%),linear-gradient(145deg,#071016,#0d171e 60%,#091117);overflow-x:hidden}\n"
              "    body:before{content:\"\";position:fixed;inset:-30%;background:conic-gradient(from 90deg,#68d5ff0b,#b59cff10,#68d5ff0b);animation:drift 18s linear infinite;pointer-events:none}\n"
              "    @keyframes drift{to{transform:rotate(360deg)}}\n"
              "    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n"
              "    main{position:relative;max-width:920px;margin:auto;padding:22px 16px 70px}\n"
