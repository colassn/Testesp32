name: STEP 6 FIXED - 香港全中文天氣時鐘

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read original STEP 6 workflow
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL=".github/workflows/step6_hk_chinese_weather.yml"

          if [ ! -f "$ORIGINAL" ]; then
            echo "搵唔到 $ORIGINAL"
            exit 1
          fi

          python3 -m pip install --disable-pip-version-check --quiet pyyaml

          python3 <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/step6_hk_chinese_weather.yml")
          data = yaml.safe_load(source.read_text(encoding="utf-8"))

          steps = data["jobs"]["build"]["steps"]
          output = Path(".step6_run_scripts")
          output.mkdir(exist_ok=True)

          run_index = 0
          for step in steps:
              script = step.get("run")
              if script is None:
                  continue

              name = str(step.get("name", f"step-{run_index}"))
              path = output / f"{run_index:02d}.sh"
              path.write_text(
                  "#!/usr/bin/env bash\n"
                  "set -euo pipefail\n"
                  f'echo "::group::{name}"\n'
                  + script
                  + f'\necho "::endgroup::"\n',
                  encoding="utf-8",
              )
              path.chmod(0o755)
              run_index += 1

          print(f"已擷取 {run_index} 個原有執行步驟")
          PY

      - name: Run original steps with LVGL font fix
        shell: bash
        run: |
          set -euo pipefail

          scripts=(.step6_run_scripts/*.sh)

          if [ "${#scripts[@]}" -lt 5 ]; then
            echo "原有 STEP 6 workflow 結構唔完整"
            exit 1
          fi

          # 1. Clone proven display project
          bash "${scripts[0]}"

          # 2. Generate Hong Kong Chinese font files
          bash "${scripts[1]}"

          # 修正 lv_font_conv 產生嘅錯誤 header 路徑
          echo "::group::Fix generated LVGL font headers"
          found=0
          while IFS= read -r -d '' font_file; do
            sed -i 's|#include "lvgl/lvgl.h"|#include "lvgl.h"|g' "$font_file"
            echo "已修正：$font_file"
            found=$((found + 1))
          done < <(find project/main -maxdepth 1 -type f -name 'hk_*.c' -print0)

          if [ "$found" -eq 0 ]; then
            echo "搵唔到生成嘅中文字型 C 檔"
            exit 1
          fi

          if grep -R --line-number '#include "lvgl/lvgl.h"' project/main/hk_*.c; then
            echo "仲有未修正嘅 LVGL header"
            exit 1
          fi
          echo "::endgroup::"

          # 3. Add firmware source
          # 4. Build firmware
          # 5. Add instructions
          for ((i=2; i<${#scripts[@]}; i++)); do
            bash "${scripts[$i]}"
          done

      - name: Upload fixed firmware package
        uses: actions/upload-artifact@v4
        with:
          name: STEP6-HK-Chinese-Weather-FIXED
          path: |
            project/STEP6-HK-CHINESE-WEATHER-OTA-APP.bin
            project/STEP6-HK-CHINESE-WEATHER-FULL.bin
            project/README-先睇.txt
          if-no-files-found: error
