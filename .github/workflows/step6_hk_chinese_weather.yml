              if (style.hidden) return;
              lv_obj_t *box = lv_obj_create(screen);
              lv_obj_set_pos(box, style.x, style.y);
              lv_obj_set_size(box, style.width, style.height);
              style_box(box, active_bg_color(&style), style.radius);
          }

