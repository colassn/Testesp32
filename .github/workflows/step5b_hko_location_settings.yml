          static bool weather_station_is_valid(const char *station)
          {
              if (station == NULL || station[0] == '\0') {
                  return false;
              }

              for (size_t index = 0;
                   index < sizeof(HKO_TEMPERATURE_STATIONS) /
                               sizeof(HKO_TEMPERATURE_STATIONS[0]);
                   index++) {
                  if (strcmp(station, HKO_TEMPERATURE_STATIONS[index]) == 0) {
                      return true;
                  }
              }

              return false;
          }

          static bool stopwatch_running = false;
          static int64_t stopwatch_accumulated_us = 0;
          static int64_t stopwatch_started_us = 0;

          static uint32_t parse_hex_color(const char *text, uint32_t fallback)
          {
              if (text == NULL || text[0] != '#' || strlen(text) < 7) {
                  return fallback;
              }

              char value[7];
              memcpy(value, text + 1, 6);
              value[6] = '\0';
              return (uint32_t)strtoul(value, NULL, 16);
          }

          static bool extract_attribute(
              const char *element,
              const char *name,
              char *output,
              size_t output_size)
          {
              if (element == NULL || output == NULL || output_size == 0) {
                  return false;
              }

              const char *tag_end = strchr(element, '>');
              if (tag_end == NULL) {
                  return false;
              }

              const char *cursor = element;
              size_t name_length = strlen(name);

              while ((cursor = strstr(cursor, name)) != NULL && cursor < tag_end) {
                  const char *after_name = cursor + name_length;

                  while (after_name < tag_end &&
                         (*after_name == ' ' || *after_name == '\t')) {
                      after_name++;
                  }

                  if (after_name >= tag_end || *after_name != '=') {
                      cursor += name_length;
                      continue;
                  }

                  after_name++;
                  while (after_name < tag_end &&
                         (*after_name == ' ' || *after_name == '\t')) {
                      after_name++;
                  }

                  if (after_name >= tag_end ||
                      (*after_name != '"' && *after_name != '\'')) {
                      return false;
                  }

                  char quote = *after_name++;
                  const char *value_end = after_name;

                  while (value_end < tag_end && *value_end != quote) {
                      value_end++;
                  }

                  if (value_end >= tag_end) {
                      return false;
                  }

                  size_t length = (size_t)(value_end - after_name);
                  if (length >= output_size) {
                      length = output_size - 1;
                  }

                  memcpy(output, after_name, length);
                  output[length] = '\0';
                  return true;
              }

              return false;
          }

          static const char *find_element(
              const char *html,
              const char *attribute,
              const char *value)
          {
              char double_pattern[96];
              char single_pattern[96];

              snprintf(
                  double_pattern,
                  sizeof(double_pattern),
                  "%s=\"%s\"",
                  attribute,
                  value);
              snprintf(
                  single_pattern,
                  sizeof(single_pattern),
                  "%s='%s'",
                  attribute,
                  value);

              const char *marker = strstr(html, double_pattern);
              if (marker == NULL) {
                  marker = strstr(html, single_pattern);
              }
              if (marker == NULL) {
                  return NULL;
              }

              const char *start = marker;
              while (start > html && *start != '<') {
                  start--;
              }

              return *start == '<' ? start : NULL;
          }

          static bool extract_inner_text(
              const char *element,
              char *output,
              size_t output_size)
          {
              if (element == NULL || output_size == 0) {
                  return false;
              }

              const char *start = strchr(element, '>');
              if (start == NULL) {
                  return false;
              }
              start++;

              const char *end = strchr(start, '<');
              if (end == NULL) {
                  return false;
              }

              while (start < end &&
                     (*start == ' ' || *start == '\t' ||
                      *start == '\r' || *start == '\n')) {
                  start++;
              }
              while (end > start &&
                     (end[-1] == ' ' || end[-1] == '\t' ||
                      end[-1] == '\r' || end[-1] == '\n')) {
                  end--;
              }

              size_t length = (size_t)(end - start);
              if (length >= output_size) {
                  length = output_size - 1;
              }

              memcpy(output, start, length);
              output[length] = '\0';
              return true;
          }

          static bool extract_css_value(
              const char *style,
              const char *property,
              char *output,
              size_t output_size)
          {
              if (style == NULL || output_size == 0) {
                  return false;
              }

              size_t property_length = strlen(property);
              const char *cursor = style;

              while ((cursor = strstr(cursor, property)) != NULL) {
                  bool valid_start =
                      cursor == style ||
                      cursor[-1] == ';' ||
                      cursor[-1] == ' ' ||
                      cursor[-1] == '\t';

                  const char *after = cursor + property_length;
                  while (*after == ' ' || *after == '\t') {
                      after++;
                  }

                  if (!valid_start || *after != ':') {
                      cursor += property_length;
                      continue;
                  }

                  after++;
                  while (*after == ' ' || *after == '\t') {
                      after++;
                  }

                  const char *end = strchr(after, ';');
                  if (end == NULL) {
                      end = after + strlen(after);
                  }

                  while (end > after &&
                         (end[-1] == ' ' || end[-1] == '\t')) {
                      end--;
                  }

                  size_t length = (size_t)(end - after);
                  if (length >= output_size) {
                      length = output_size - 1;
                  }

                  memcpy(output, after, length);
                  output[length] = '\0';
                  return true;
              }

              return false;
          }

          static int css_integer(
              const char *style,
              const char *property,
              int fallback)
          {
              char value[32];

              if (!extract_css_value(
                      style, property, value, sizeof(value))) {
                  return fallback;
              }

              return atoi(value);
          }

          static bool css_hidden(const char *style)
          {
              char value[32];

              if (!extract_css_value(
                      style, "display", value, sizeof(value))) {
                  return false;
              }

              return strcasecmp(value, "none") == 0;
          }

          static lv_text_align_t css_alignment(
              const char *style,
              lv_text_align_t fallback)
          {
              char value[32];

              if (!extract_css_value(
                      style, "text-align", value, sizeof(value))) {
                  return fallback;
              }

              if (strcasecmp(value, "center") == 0) {
                  return LV_TEXT_ALIGN_CENTER;
              }
              if (strcasecmp(value, "right") == 0) {
                  return LV_TEXT_ALIGN_RIGHT;
              }
              return LV_TEXT_ALIGN_LEFT;
          }

          static const lv_font_t *font_for_size(int size)
          {
              if (size >= 44) {
                  return &lv_font_montserrat_48;
              }
              if (size >= 34) {
                  return &lv_font_montserrat_36;
              }
              if (size >= 30) {
                  return &lv_font_montserrat_32;
              }
              if (size >= 24) {
                  return &lv_font_montserrat_28;
              }
              if (size >= 17) {
                  return &lv_font_montserrat_20;
              }
              return &lv_font_montserrat_14;
          }

          static html_style_t read_style(
              const char *element,
              html_style_t defaults)
          {
              char style[512] = "";
              char value[32];

              if (element != NULL) {
                  extract_attribute(
                      element, "style", style, sizeof(style));

                  defaults.x =
                      css_integer(style, "left", defaults.x);
                  defaults.y =
                      css_integer(style, "top", defaults.y);
                  defaults.width =
                      css_integer(style, "width", defaults.width);
                  defaults.height =
                      css_integer(style, "height", defaults.height);
                  defaults.font_size =
                      css_integer(style, "font-size", defaults.font_size);
                  defaults.radius =
                      css_integer(style, "border-radius", defaults.radius);
                  defaults.align =
                      css_alignment(style, defaults.align);
                  defaults.hidden = css_hidden(style);

                  if (extract_attribute(
                          element,
                          "data-light-color",
                          value,
                          sizeof(value))) {
                      defaults.light_color =
                          parse_hex_color(value, defaults.light_color);
                  }
                  if (extract_attribute(
                          element,
                          "data-dark-color",
                          value,
                          sizeof(value))) {
                      defaults.dark_color =
                          parse_hex_color(value, defaults.dark_color);
                  }
                  if (extract_attribute(
                          element,
                          "data-light-bg",
                          value,
                          sizeof(value))) {
                      defaults.light_bg =
                          parse_hex_color(value, defaults.light_bg);
                  }
                  if (extract_attribute(
                          element,
                          "data-dark-bg",
                          value,
                          sizeof(value))) {
                      defaults.dark_bg =
                          parse_hex_color(value, defaults.dark_bg);
                  }
              }

              return defaults;
          }

          static uint32_t active_text_color(const html_style_t *style)
          {
              return dark_mode ? style->dark_color : style->light_color;
          }

          static uint32_t active_bg_color(const html_style_t *style)
          {
              return dark_mode ? style->dark_bg : style->light_bg;
          }

          static void style_box(
              lv_obj_t *object,
              uint32_t color,
              int radius)
          {
              lv_obj_set_style_bg_color(
                  object, lv_color_hex(color), 0);
              lv_obj_set_style_bg_opa(
                  object, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(
                  object, radius, 0);
              lv_obj_set_style_border_width(
                  object, 0, 0);
              lv_obj_set_style_pad_all(
                  object, 0, 0);
              lv_obj_clear_flag(
                  object, LV_OBJ_FLAG_SCROLLABLE);
          }

          static lv_obj_t *create_label(
              lv_obj_t *parent,
              const char *text,
              const html_style_t *style)
          {
              if (style->hidden) {
                  return NULL;
              }

              lv_obj_t *label = lv_label_create(parent);
              lv_label_set_text(label, text);
              lv_obj_set_pos(label, style->x, style->y);
              lv_obj_set_width(label, style->width);
              lv_obj_set_height(label, style->height);
              lv_obj_set_style_text_font(
                  label, font_for_size(style->font_size), 0);
              lv_obj_set_style_text_color(
                  label,
                  lv_color_hex(active_text_color(style)),
                  0);
              lv_obj_set_style_text_align(
                  label, style->align, 0);
              lv_label_set_long_mode(
                  label, LV_LABEL_LONG_CLIP);
              return label;
          }

          static bool clock_is_valid(void)
          {
              return time(NULL) >= 1735689600;
          }

          static int64_t stopwatch_elapsed_now(void)
          {
              if (!stopwatch_running) {
                  return stopwatch_accumulated_us;
              }

              return stopwatch_accumulated_us +
                     (esp_timer_get_time() - stopwatch_started_us);
          }

          static void save_theme_preference(void)
          {
              nvs_handle_t handle;

              if (nvs_open(
                      "display_cfg",
                      NVS_READWRITE,
                      &handle) != ESP_OK) {
                  return;
              }

              nvs_set_u8(handle, "dark", dark_mode ? 1 : 0);
              nvs_commit(handle);
              nvs_close(handle);
          }

          static void load_theme_preference(void)
          {
              nvs_handle_t handle;
              uint8_t value = 0;

              if (nvs_open(
                      "display_cfg",
                      NVS_READONLY,
                      &handle) != ESP_OK) {
                  return;
              }

              if (nvs_get_u8(handle, "dark", &value) == ESP_OK) {
                  dark_mode = value != 0;
                  theme_loaded_from_nvs = true;
              }

              nvs_close(handle);
          }

          static void load_weather_station(void)
          {
              nvs_handle_t handle;
              size_t length = sizeof(weather_station);

              if (nvs_open(
                      "weather_cfg",
                      NVS_READONLY,
                      &handle) != ESP_OK) {
                  return;
              }

              char stored[sizeof(weather_station)] = "";
              if (nvs_get_str(
                      handle,
                      "station",
                      stored,
                      &length) == ESP_OK &&
                  weather_station_is_valid(stored)) {
                  strlcpy(
                      weather_station,
                      stored,
                      sizeof(weather_station));
              }

              nvs_close(handle);
          }

          static esp_err_t save_weather_station(const char *station)
          {
              if (!weather_station_is_valid(station)) {
                  return ESP_ERR_INVALID_ARG;
              }

              nvs_handle_t handle;
              esp_err_t error =
                  nvs_open(
                      "weather_cfg",
                      NVS_READWRITE,
                      &handle);

              if (error != ESP_OK) {
                  return error;
              }

              error = nvs_set_str(handle, "station", station);
              if (error == ESP_OK) {
                  error = nvs_commit(handle);
              }

              nvs_close(handle);

              if (error == ESP_OK) {
                  strlcpy(
                      weather_station,
                      station,
                      sizeof(weather_station));
              }

              return error;
          }

          static char *read_text_file(
              const char *path,
              size_t maximum)
          {
              FILE *file = fopen(path, "rb");
              if (file == NULL) {
                  return NULL;
              }

              if (fseek(file, 0, SEEK_END) != 0) {
                  fclose(file);
                  return NULL;
              }

              long length = ftell(file);
              if (length < 0 || (size_t)length > maximum) {
                  fclose(file);
                  return NULL;
              }

              rewind(file);
              char *buffer = calloc(1, (size_t)length + 1);
              if (buffer == NULL) {
                  fclose(file);
                  return NULL;
              }

              size_t read_count =
                  fread(buffer, 1, (size_t)length, file);
              fclose(file);

              if (read_count != (size_t)length) {
                  free(buffer);
                  return NULL;
              }

              buffer[length] = '\0';
              return buffer;
          }

          static esp_err_t write_display_html(
              const char *html,
              size_t length)
          {
              if (html == NULL ||
                  length == 0 ||
                  length > DISPLAY_HTML_MAX ||
                  strstr(html, "<body") == NULL ||
                  find_element(
                      html, "data-widget", "clock") == NULL) {
                  return ESP_ERR_INVALID_ARG;
              }

              FILE *file = fopen(DISPLAY_HTML_TEMP_PATH, "wb");
              if (file == NULL) {
                  return ESP_FAIL;
              }

              size_t written = fwrite(html, 1, length, file);
              fclose(file);

              if (written != length) {
                  unlink(DISPLAY_HTML_TEMP_PATH);
                  return ESP_FAIL;
              }

              unlink(DISPLAY_HTML_PATH);

              if (rename(
                      DISPLAY_HTML_TEMP_PATH,
                      DISPLAY_HTML_PATH) != 0) {
                  unlink(DISPLAY_HTML_TEMP_PATH);
                  return ESP_FAIL;
              }

              html_file_ready = true;
              return ESP_OK;
          }

          static esp_err_t ensure_default_display_html(void)
          {
              char *existing =
                  read_text_file(
                      DISPLAY_HTML_PATH,
                      DISPLAY_HTML_MAX);

              if (existing != NULL) {
                  html_file_ready = true;
                  free(existing);
                  return ESP_OK;
              }

              return write_display_html(
                  DEFAULT_DISPLAY_HTML,
                  strlen(DEFAULT_DISPLAY_HTML));
          }


          typedef struct {
              char *data;
              size_t length;
              size_t capacity;
          } hko_http_buffer_t;

          static lv_timer_t *full_redraw_timer = NULL;
          static uint8_t full_redraw_passes = 0;

          static void full_redraw_timer_cb(lv_timer_t *timer)
          {
              lv_obj_t *screen = lv_screen_active();

              if (screen != NULL) {
                  lv_obj_invalidate(screen);
              }

              if (full_redraw_passes > 0) {
                  full_redraw_passes--;
              }

              if (full_redraw_passes == 0) {
                  lv_timer_delete(timer);
                  full_redraw_timer = NULL;
              }
          }

          static void schedule_full_redraw(void)
          {
              lv_obj_t *screen = lv_screen_active();

              if (screen != NULL) {
                  lv_obj_invalidate(screen);
              }

              full_redraw_passes = 6;

              if (full_redraw_timer == NULL) {
                  full_redraw_timer =
                      lv_timer_create(
                          full_redraw_timer_cb,
                          25,
                          NULL);
              } else {
                  lv_timer_reset(full_redraw_timer);
              }
          }

          static esp_err_t hko_http_event_handler(
              esp_http_client_event_t *event)
          {
              hko_http_buffer_t *buffer = event->user_data;

              if (event->event_id != HTTP_EVENT_ON_DATA ||
                  event->data_len <= 0 ||
                  buffer == NULL) {
                  return ESP_OK;
              }

              if (buffer->length + (size_t)event->data_len + 1 >
                  buffer->capacity) {
                  return ESP_ERR_NO_MEM;
              }

              memcpy(
                  buffer->data + buffer->length,
                  event->data,
                  (size_t)event->data_len);
              buffer->length += (size_t)event->data_len;
              buffer->data[buffer->length] = '\0';
              return ESP_OK;
          }

          static esp_err_t hko_http_get(
              const char *url,
              char **response)
          {
              if (response == NULL) {
                  return ESP_ERR_INVALID_ARG;
              }

              *response = NULL;

              hko_http_buffer_t buffer = {
                  .data = calloc(1, HKO_HTTP_MAX),
                  .length = 0,
                  .capacity = HKO_HTTP_MAX,
              };

              if (buffer.data == NULL) {
                  return ESP_ERR_NO_MEM;
              }

              esp_http_client_config_t configuration = {
                  .url = url,
                  .event_handler = hko_http_event_handler,
                  .user_data = &buffer,
                  .timeout_ms = 15000,
                  .buffer_size = 2048,
                  .buffer_size_tx = 512,
                  .crt_bundle_attach = esp_crt_bundle_attach,
                  .keep_alive_enable = true,
              };

              esp_http_client_handle_t client =
                  esp_http_client_init(&configuration);

              if (client == NULL) {
                  free(buffer.data);
                  return ESP_FAIL;
              }

              esp_err_t error = esp_http_client_perform(client);
              int status_code =
                  esp_http_client_get_status_code(client);
              esp_http_client_cleanup(client);

              if (error != ESP_OK ||
                  status_code != 200 ||
                  buffer.length == 0) {
                  free(buffer.data);
                  return error == ESP_OK ? ESP_FAIL : error;
              }

              *response = buffer.data;
              return ESP_OK;
          }

