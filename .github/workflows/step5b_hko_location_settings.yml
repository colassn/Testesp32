          static void uppercase_ascii(char *text)
          {
              if (text == NULL) {
                  return;
              }

              while (*text != '\0') {
                  *text = (char)toupper((unsigned char)*text);
                  text++;
              }
          }

          static void shorten_forecast_text(
              const char *source,
              char *destination,
              size_t destination_size)
          {
              if (destination_size == 0) {
                  return;
              }

              if (source == NULL || source[0] == '\0') {
                  strlcpy(destination, "FORECAST", destination_size);
                  return;
              }

              size_t written = 0;

              while (source[written] != '\0' &&
                     source[written] != '.' &&
                     source[written] != '\n' &&
                     written + 1 < destination_size &&
                     written < 26) {
                  destination[written] = source[written];
                  written++;
              }

              destination[written] = '\0';
              uppercase_ascii(destination);
          }

          static void refresh_weather_labels(void)
