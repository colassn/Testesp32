                  MANAGEMENT_PAGE,
                  HTTPD_RESP_USE_STRLEN);
          }

          static esp_err_t status_get_handler(
              httpd_req_t *request)
          {
              bool connected =
                  (xEventGroupGetBits(wifi_events) &
                   WIFI_CONNECTED_BIT) != 0;
              char ip_text[24] = "";

              if (connected) {
                  esp_netif_t *network_interface =
                      esp_netif_get_handle_from_ifkey(
                          "WIFI_STA_DEF");
                  esp_netif_ip_info_t information;

                  if (network_interface != NULL &&
                      esp_netif_get_ip_info(
                          network_interface,
                          &information) == ESP_OK) {
                      snprintf(
                          ip_text,
                          sizeof(ip_text),
                          IPSTR,
                          IP2STR(&information.ip));
                  }
              }

              char response[512];
              snprintf(
                  response,
                  sizeof(response),
                  "{\"connected\":%s,"
                  "\"ssid\":\"%s\","
                  "\"ip\":\"%s\","
                  "\"station\":\"%s\","
                  "\"clock\":\"%s\","
                  "\"html\":\"%s\"}",
                  connected ? "true" : "false",
                  saved_ssid,
                  ip_text,
                  weather_station,
                  clock_is_valid()
                      ? "NTP synchronized"
                      : "waiting for NTP",
                  html_file_ready
                      ? "display.html ready"
                      : "using built-in fallback");

              httpd_resp_set_type(
                  request, "application/json");
              httpd_resp_set_hdr(
                  request,
                  "Cache-Control",
                  "no-store");
              return httpd_resp_sendstr(
                  request, response);
          }

          static esp_err_t html_get_handler(
              httpd_req_t *request)
          {
              char *html =
                  read_text_file(
                      DISPLAY_HTML_PATH,
                      DISPLAY_HTML_MAX);

              if (html == NULL) {
                  httpd_resp_set_type(
                      request,
                      "text/plain; charset=utf-8");
                  return httpd_resp_send(
                      request,
                      DEFAULT_DISPLAY_HTML,
                      HTTPD_RESP_USE_STRLEN);
              }

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              httpd_resp_set_hdr(
                  request,
                  "Cache-Control",
                  "no-store");
              esp_err_t result =
                  httpd_resp_send(
                      request,
                      html,
                      HTTPD_RESP_USE_STRLEN);
              free(html);
              return result;
          }

          static esp_err_t html_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0 ||
                  request->content_len > DISPLAY_HTML_MAX) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML must be 1 to 16384 bytes");
                  return ESP_FAIL;
              }

              char *html =
                  calloc(
                      1,
                      request->content_len + 1);
              if (html == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              esp_err_t result =
                  receive_request_body(
                      request,
                      html,
                      request->content_len);

              if (result != ESP_OK) {
                  free(html);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML receive failed");
                  return ESP_FAIL;
              }

              html[request->content_len] = '\0';

              result =
                  write_display_html(
                      html,
                      request->content_len);

              if (result != ESP_OK) {
                  free(html);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "HTML must contain <body> and data-widget=clock");
                  return ESP_FAIL;
              }

              lv_lock();
              render_display_html(html);
              schedule_full_redraw();
              lv_unlock();
              free(html);

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              return httpd_resp_sendstr(
                  request,
                  "Saved. The LCD has reloaded display.html.");
          }

          static esp_err_t default_post_handler(
              httpd_req_t *request)
          {
              (void)request;

              esp_err_t result =
                  write_display_html(
                      DEFAULT_DISPLAY_HTML,
                      strlen(DEFAULT_DISPLAY_HTML));

              if (result != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Could not restore default HTML");
                  return ESP_FAIL;
              }

              lv_lock();
              render_display_html(
                  DEFAULT_DISPLAY_HTML);
              schedule_full_redraw();
              lv_unlock();

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              return httpd_resp_sendstr(
                  request,
                  "Default clock restored.");
          }

          static esp_err_t wifi_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0 ||
                  request->content_len > 512) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid form data");
                  return ESP_FAIL;
              }

              char *body =
                  calloc(
                      1,
                      request->content_len + 1);
              if (body == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              if (receive_request_body(
                      request,
                      body,
                      request->content_len) != ESP_OK) {
                  free(body);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Form receive failed");
                  return ESP_FAIL;
              }

              char encoded_ssid[100] = "";
              char encoded_password[180] = "";
              char decoded_ssid[33] = "";
              char decoded_password[65] = "";

              esp_err_t ssid_result =
                  httpd_query_key_value(
                      body,
                      "ssid",
                      encoded_ssid,
                      sizeof(encoded_ssid));
              esp_err_t password_result =
                  httpd_query_key_value(
                      body,
                      "password",
                      encoded_password,
                      sizeof(encoded_password));
              free(body);

              if (ssid_result != ESP_OK ||
                  !url_decode(
                      decoded_ssid,
                      sizeof(decoded_ssid),
                      encoded_ssid)) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid SSID");
                  return ESP_FAIL;
              }

              if (password_result == ESP_OK &&
                  !url_decode(
                      decoded_password,
                      sizeof(decoded_password),
                      encoded_password)) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid password");
                  return ESP_FAIL;
              }

              if (decoded_ssid[0] == '\0' ||
                  save_wifi_credentials(
                      decoded_ssid,
                      decoded_password) != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Could not save Wi-Fi details");
                  return ESP_FAIL;
              }

              httpd_resp_set_type(
                  request, "text/plain");
              httpd_resp_sendstr(
                  request,
                  "Wi-Fi saved. The display is restarting.");
              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          static esp_err_t weather_location_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0 ||
                  request->content_len > 256) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid location form");
                  return ESP_FAIL;
              }

              char *body =
                  calloc(
                      1,
                      request->content_len + 1);
              if (body == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              if (receive_request_body(
                      request,
                      body,
                      request->content_len) != ESP_OK) {
                  free(body);
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Location receive failed");
                  return ESP_FAIL;
              }

              char encoded_station[128] = "";
              char decoded_station[48] = "";

              esp_err_t query_result =
                  httpd_query_key_value(
                      body,
                      "station",
                      encoded_station,
                      sizeof(encoded_station));
              free(body);

              if (query_result != ESP_OK ||
                  !url_decode(
                      decoded_station,
                      sizeof(decoded_station),
                      encoded_station) ||
                  !weather_station_is_valid(decoded_station)) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Unsupported HKO temperature station");
                  return ESP_FAIL;
              }

              if (save_weather_station(decoded_station) != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Could not save weather station");
                  return ESP_FAIL;
              }

              snprintf(
                  weather_now_text,
                  sizeof(weather_now_text),
                  "%s  -- C    HKO RH --%%",
                  weather_station);
              strlcpy(
                  weather_desc_text,
                  "UPDATING SELECTED HKO STATION...",
                  sizeof(weather_desc_text));
              strlcpy(
                  weather_update_text,
                  "LOCATION SAVED - FETCHING WEATHER NOW",
                  sizeof(weather_update_text));
              refresh_weather_labels();

              if (weather_task_handle != NULL) {
                  xTaskNotifyGive(weather_task_handle);
              }

              httpd_resp_set_type(
                  request,
                  "text/plain; charset=utf-8");
              return httpd_resp_sendstr(
                  request,
                  "Location saved. Weather update requested.");
          }

