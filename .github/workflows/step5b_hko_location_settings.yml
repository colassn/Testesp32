          static esp_err_t local_ota_post_handler(
              httpd_req_t *request)
          {
              if (request->content_len <= 0) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Empty upload");
                  return ESP_FAIL;
              }

              const esp_partition_t *partition =
                  esp_ota_get_next_update_partition(NULL);

              if (partition == NULL) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "No OTA partition");
                  return ESP_FAIL;
              }

              esp_ota_handle_t ota_handle;
              esp_err_t error =
                  esp_ota_begin(
                      partition,
                      request->content_len,
                      &ota_handle);

              if (error != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "OTA start failed");
                  return ESP_FAIL;
              }

              char *buffer =
                  malloc(LOCAL_OTA_BUFFER);
              if (buffer == NULL) {
                  esp_ota_abort(ota_handle);
                  httpd_resp_send_err(
                      request,
                      HTTPD_500_INTERNAL_SERVER_ERROR,
                      "Out of memory");
                  return ESP_FAIL;
              }

              int remaining =
                  request->content_len;

              while (remaining > 0) {
                  int wanted =
                      remaining > LOCAL_OTA_BUFFER
                          ? LOCAL_OTA_BUFFER
                          : remaining;
                  int count =
                      httpd_req_recv(
                          request,
                          buffer,
                          wanted);

                  if (count == HTTPD_SOCK_ERR_TIMEOUT) {
                      continue;
                  }

                  if (count <= 0 ||
                      esp_ota_write(
                          ota_handle,
                          buffer,
                          count) != ESP_OK) {
                      free(buffer);
                      esp_ota_abort(ota_handle);
                      httpd_resp_send_err(
                          request,
                          HTTPD_500_INTERNAL_SERVER_ERROR,
                          "OTA upload failed");
                      return ESP_FAIL;
                  }

                  remaining -= count;
              }

              free(buffer);
              error = esp_ota_end(ota_handle);

              if (error != ESP_OK ||
                  esp_ota_set_boot_partition(
                      partition) != ESP_OK) {
                  httpd_resp_send_err(
                      request,
                      HTTPD_400_BAD_REQUEST,
                      "Invalid OTA APP firmware");
                  return ESP_FAIL;
              }

              httpd_resp_set_type(
                  request, "text/plain");
              httpd_resp_sendstr(
                  request,
                  "Update successful. The display is restarting.");
              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          static void start_web_server(void)
          {
              httpd_config_t configuration =
                  HTTPD_DEFAULT_CONFIG();
              configuration.stack_size = 12288;
              configuration.recv_wait_timeout = 60;
              configuration.send_wait_timeout = 60;
              configuration.max_uri_handlers = 12;

              ESP_ERROR_CHECK(
                  httpd_start(
                      &web_server,
                      &configuration));

              const httpd_uri_t routes[] = {
                  {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = index_get_handler,
                  },
                  {
                      .uri = "/api/status",
                      .method = HTTP_GET,
                      .handler = status_get_handler,
                  },
                  {
                      .uri = "/api/html",
                      .method = HTTP_GET,
                      .handler = html_get_handler,
                  },
                  {
                      .uri = "/api/html",
                      .method = HTTP_POST,
                      .handler = html_post_handler,
                  },
                  {
                      .uri = "/api/default",
                      .method = HTTP_POST,
                      .handler = default_post_handler,
                  },
                  {
                      .uri = "/wifi",
                      .method = HTTP_POST,
                      .handler = wifi_post_handler,
                  },
                  {
                      .uri = "/weather-location",
                      .method = HTTP_POST,
                      .handler = weather_location_post_handler,
                  },
                  {
                      .uri = "/api/weather-refresh",
                      .method = HTTP_POST,
                      .handler = weather_refresh_post_handler,
                  },
                  {
                      .uri = "/update",
                      .method = HTTP_POST,
                      .handler = local_ota_post_handler,
                  },
              };

              for (size_t index = 0;
                   index <
                       sizeof(routes) /
                       sizeof(routes[0]);
                   ++index) {
                  ESP_ERROR_CHECK(
                      httpd_register_uri_handler(
                          web_server,
                          &routes[index]));
              }
          }

          static esp_err_t ensure_sntp_time(void)
          {
              if (clock_is_valid()) {
                  return ESP_OK;
              }

              if (!sntp_started) {
                  esp_sntp_config_t configuration =
                      ESP_NETIF_SNTP_DEFAULT_CONFIG(
                          "pool.ntp.org");
                  esp_err_t error =
                      esp_netif_sntp_init(
                          &configuration);

                  if (error != ESP_OK &&
                      error != ESP_ERR_INVALID_STATE) {
                      return error;
                  }

                  sntp_started = true;
              }

              return esp_netif_sntp_sync_wait(
                  pdMS_TO_TICKS(15000));
          }

          static void time_sync_task(void *argument)
          {
              (void)argument;

              for (;;) {
                  xEventGroupWaitBits(
                      wifi_events,
                      WIFI_CONNECTED_BIT,
                      pdFALSE,
                      pdTRUE,
                      portMAX_DELAY);

                  set_sync_status(
                      "SYNCING HONG KONG TIME...");

                  if (ensure_sntp_time() != ESP_OK) {
                      set_sync_status(
                          "TIME SYNC FAILED - RETRYING");
                      vTaskDelay(
                          pdMS_TO_TICKS(30000));
                      continue;
                  }

                  set_sync_status(
                      "TIME SYNCHRONIZED");
                  vTaskDelay(
                      pdMS_TO_TICKS(
                          60 * 60 * 1000));
              }
          }

          void app_main(void)
          {
              ESP_ERROR_CHECK(initialise_nvs());
              ESP_ERROR_CHECK(initialise_spiffs());

              load_theme_preference();
              load_weather_station();
              ESP_ERROR_CHECK(
                  ensure_default_display_html());
              install_hko_dashboard_once();

              setenv("TZ", "HKT-8", 1);
              tzset();

              sunton_esp32s3_backlight_init();

              lv_display_t *display =
                  sunton_esp32s3_lcd_init();
              (void)display;

              i2c_master_bus_handle_t i2c_master =
                  sunton_esp32s3_i2c_master();
              sunton_esp32s3_touch_init(i2c_master);

              lv_lock();
              reload_display_locked();
              lv_timer_create(
                  clock_timer_cb, 20, NULL);
              lv_unlock();

              start_wifi();
              start_web_server();

              xTaskCreate(
                  time_sync_task,
                  "time_sync",
                  4096,
                  NULL,
                  5,
                  NULL);

              xTaskCreate(
                  weather_task,
                  "hko_weather",
                  8192,
                  NULL,
                  4,
                  NULL);
          }
