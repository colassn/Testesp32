              "    textarea{width:100%;height:360px;padding:12px;border:1px solid #ccd3d8;border-radius:10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}\n"
              "    input[type=text],input[type=password],select{width:100%;padding:12px;border:1px solid #ccd3d8;border-radius:10px;font:inherit;background:white}\n"
              "    label{display:block;font-weight:700;margin:12px 0 6px}\n"
