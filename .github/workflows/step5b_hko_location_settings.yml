              "\n"
              "<script>\n"
              "async function loadStatus(){\n"
              "  try{\n"
              "    const r=await fetch('/api/status',{cache:'no-store'});\n"
              "    const j=await r.json();\n"
              "    document.getElementById('deviceStatus').textContent=\n"
              "      `Home Wi-Fi: ${j.connected?'connected':'not connected'}\\n`+\n"
              "      `SSID: ${j.ssid||'-'}\\nIP: ${j.ip||'-'}\\n`+\n"
              "      `Weather station: ${j.station||'-'}\\n`+\n"
              "      `Clock: ${j.clock}\\nHTML: ${j.html}`;\n"
              "    if(j.station){\n"
              "      document.getElementById('weatherStation').value=j.station;\n"
              "    }\n"
              "  }catch(e){\n"
              "    document.getElementById('deviceStatus').textContent='Status unavailable';\n"
              "  }\n"
              "}\n"
              "\n"
              "async function saveWeatherStation(){\n"
              "  const station=document.getElementById('weatherStation').value;\n"
              "  const s=document.getElementById('weatherStatus');\n"
              "  s.textContent='Saving location...';\n"
              "  try{\n"
              "    const body=new URLSearchParams({station});\n"
              "    const r=await fetch('/weather-location',{\n"
              "      method:'POST',\n"
              "      headers:{'Content-Type':'application/x-www-form-urlencoded'},\n"
              "      body\n"
              "    });\n"
              "    s.textContent=await r.text();\n"
              "    loadStatus();\n"
              "  }catch(e){\n"
              "    s.textContent='Save failed';\n"
              "  }\n"
              "}\n"
              "\n"
              "async function refreshWeather(){\n"
              "  const s=document.getElementById('weatherStatus');\n"
              "  s.textContent='Refreshing...';\n"
              "  try{\n"
              "    const r=await fetch('/api/weather-refresh',{method:'POST'});\n"
              "    s.textContent=await r.text();\n"
              "  }catch(e){\n"
              "    s.textContent='Refresh request failed';\n"
              "  }\n"
              "}\n"
              "\n"
              "async function loadHtml(){\n"
              "  const r=await fetch('/api/html',{cache:'no-store'});\n"
              "  document.getElementById('editor').value=await r.text();\n"
              "  previewHtml();\n"
              "}\n"
              "\n"
              "async function saveHtml(){\n"
              "  const s=document.getElementById('editorStatus');\n"
              "  s.textContent='Saving...';\n"
              "  try{\n"
              "    const r=await fetch('/api/html',{\n"
              "      method:'POST',\n"
              "      headers:{'Content-Type':'text/html; charset=utf-8'},\n"
              "      body:document.getElementById('editor').value\n"
              "    });\n"
              "    s.textContent=await r.text();\n"
              "    loadStatus();\n"
              "  }catch(e){s.textContent='Save failed';}\n"
              "}\n"
              "\n"
              "async function restoreDefault(){\n"
              "  if(!confirm('Restore the built-in clock and weather layout?'))return;\n"
              "  const r=await fetch('/api/default',{method:'POST'});\n"
              "  document.getElementById('editorStatus').textContent=await r.text();\n"
              "  await loadHtml();\n"
              "}\n"
              "\n"
              "function loadFile(event){\n"
              "  const f=event.target.files[0];\n"
              "  if(!f)return;\n"
              "  const reader=new FileReader();\n"
              "  reader.onload=()=>{\n"
              "    document.getElementById('editor').value=reader.result;\n"
              "    previewHtml();\n"
              "  };\n"
              "  reader.readAsText(f);\n"
              "}\n"
              "\n"
              "function previewHtml(){\n"
              "  document.getElementById('preview').srcdoc=\n"
              "    document.getElementById('editor').value;\n"
              "}\n"
              "\n"
              "async function uploadFirmware(){\n"
              "  const f=document.getElementById('fw').files[0];\n"
              "  const s=document.getElementById('uploadStatus');\n"
              "  if(!f){s.textContent='Choose an OTA APP .bin first';return;}\n"
              "  if(!confirm('Upload '+f.name+'?'))return;\n"
              "  s.textContent='Uploading. Keep power connected...';\n"
              "  try{\n"
              "    const r=await fetch('/update',{\n"
              "      method:'POST',\n"
              "      headers:{'Content-Type':'application/octet-stream'},\n"
              "      body:f\n"
              "    });\n"
              "    s.textContent=await r.text();\n"
              "  }catch(e){s.textContent='Device may be restarting.';}\n"
              "}\n"
              "\n"
              "loadStatus();\n"
              "loadHtml();\n"
              "setInterval(loadStatus,5000);\n"
              "</script>\n"
              "</body>\n"
              "</html>\n";
