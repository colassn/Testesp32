          static esp_err_t parse_hko_current(const char *json_text)
          {
              cJSON *root = cJSON_Parse(json_text);
              if (root == NULL) {
                  return ESP_FAIL;
              }

              int temperature = -1000;
              int humidity = -1;
              int icon = -1;

              cJSON *temperature_object =
                  cJSON_GetObjectItemCaseSensitive(root, "temperature");
              cJSON *temperature_data =
                  cJSON_GetObjectItemCaseSensitive(
                      temperature_object,
                      "data");

              cJSON *entry = NULL;
              cJSON_ArrayForEach(entry, temperature_data) {
                  cJSON *place =
                      cJSON_GetObjectItemCaseSensitive(entry, "place");
                  cJSON *value =
                      cJSON_GetObjectItemCaseSensitive(entry, "value");

                  if (cJSON_IsString(place) &&
                      cJSON_IsNumber(value) &&
                      strcmp(place->valuestring, weather_station) == 0) {
                      temperature = value->valueint;
                      break;
                  }
              }

              cJSON *humidity_object =
                  cJSON_GetObjectItemCaseSensitive(root, "humidity");
              cJSON *humidity_data =
                  cJSON_GetObjectItemCaseSensitive(
                      humidity_object,
                      "data");
              cJSON *humidity_entry =
                  cJSON_GetArrayItem(humidity_data, 0);
              cJSON *humidity_value =
                  cJSON_GetObjectItemCaseSensitive(
                      humidity_entry,
                      "value");

              if (cJSON_IsNumber(humidity_value)) {
                  humidity = humidity_value->valueint;
              }

              cJSON *icon_array =
                  cJSON_GetObjectItemCaseSensitive(root, "icon");
              cJSON *icon_value =
                  cJSON_GetArrayItem(icon_array, 0);

              if (cJSON_IsNumber(icon_value)) {
                  icon = icon_value->valueint;
              }

              cJSON *update_time =
                  cJSON_GetObjectItemCaseSensitive(root, "updateTime");

              if (temperature > -1000 && humidity >= 0) {
                  snprintf(
                      weather_now_text,
                      sizeof(weather_now_text),
                      "%s  %d C    HKO RH %d%%",
                      weather_station,
                      temperature,
                      humidity);
              } else if (temperature > -1000) {
                  snprintf(
                      weather_now_text,
                      sizeof(weather_now_text),
                      "%s  %d C",
                      weather_station,
                      temperature);
              } else {
                  snprintf(
                      weather_now_text,
                      sizeof(weather_now_text),
                      "%s TEMPERATURE UNAVAILABLE",
                      weather_station);
              }

              strlcpy(
                  weather_desc_text,
                  hko_condition_from_icon(icon),
                  sizeof(weather_desc_text));

              if (cJSON_IsString(update_time) &&
                  strlen(update_time->valuestring) >= 16) {
                  snprintf(
                      weather_update_text,
                      sizeof(weather_update_text),
                      "HKO UPDATED %.5s",
                      update_time->valuestring + 11);
              } else {
                  strlcpy(
                      weather_update_text,
                      "HKO WEATHER UPDATED",
                      sizeof(weather_update_text));
              }

              cJSON_Delete(root);
              return temperature > -1000 ? ESP_OK : ESP_FAIL;
          }

          static esp_err_t parse_hko_forecast(const char *json_text)
          {
              cJSON *root = cJSON_Parse(json_text);
              if (root == NULL) {
                  return ESP_FAIL;
              }

              cJSON *forecast_array =
                  cJSON_GetObjectItemCaseSensitive(
                      root,
                      "weatherForecast");

              if (!cJSON_IsArray(forecast_array) ||
                  cJSON_GetArraySize(forecast_array) < 3) {
                  cJSON_Delete(root);
                  return ESP_FAIL;
              }

              for (int index = 0; index < 3; index++) {
                  cJSON *item =
                      cJSON_GetArrayItem(forecast_array, index);
                  cJSON *week =
                      cJSON_GetObjectItemCaseSensitive(item, "week");
                  cJSON *minimum_object =
                      cJSON_GetObjectItemCaseSensitive(
                          item,
                          "forecastMintemp");
                  cJSON *maximum_object =
                      cJSON_GetObjectItemCaseSensitive(
                          item,
                          "forecastMaxtemp");
                  cJSON *minimum =
                      cJSON_GetObjectItemCaseSensitive(
                          minimum_object,
                          "value");
                  cJSON *maximum =
                      cJSON_GetObjectItemCaseSensitive(
                          maximum_object,
                          "value");
                  cJSON *weather =
                      cJSON_GetObjectItemCaseSensitive(
                          item,
                          "forecastWeather");

                  char day[4] = "---";
                  char short_weather[48] = "FORECAST";

                  if (cJSON_IsString(week)) {
                      size_t length = strlen(week->valuestring);
                      for (size_t character = 0;
                           character < 3 && character < length;
                           character++) {
                          day[character] =
                              (char)toupper(
                                  (unsigned char)
                                      week->valuestring[character]);
                      }
                      day[3] = '\0';
                  }

                  if (cJSON_IsString(weather)) {
                      shorten_forecast_text(
                          weather->valuestring,
                          short_weather,
                          sizeof(short_weather));
                  }

                  if (cJSON_IsNumber(minimum) &&
                      cJSON_IsNumber(maximum)) {
                      snprintf(
                          forecast_text[index],
                          sizeof(forecast_text[index]),
                          "%s\\n%d-%d C\\n%s",
                          day,
                          minimum->valueint,
                          maximum->valueint,
                          short_weather);
                  } else {
                      snprintf(
                          forecast_text[index],
                          sizeof(forecast_text[index]),
                          "%s\\n-- C\\n%s",
                          day,
                          short_weather);
                  }
              }

              cJSON_Delete(root);
              return ESP_OK;
          }

          static void weather_task(void *argument)
          {
              (void)argument;
              weather_task_handle = xTaskGetCurrentTaskHandle();

              for (;;) {
                  xEventGroupWaitBits(
                      wifi_events,
                      WIFI_CONNECTED_BIT,
                      pdFALSE,
                      pdTRUE,
                      portMAX_DELAY);

                  strlcpy(
                      weather_desc_text,
                      "UPDATING HKO WEATHER...",
                      sizeof(weather_desc_text));
                  strlcpy(
                      weather_update_text,
                      "CONTACTING HONG KONG OBSERVATORY",
                      sizeof(weather_update_text));
                  refresh_weather_labels();

                  char *current_json = NULL;
                  char *forecast_json = NULL;

                  esp_err_t current_result =
                      hko_http_get(
                          HKO_CURRENT_URL,
                          &current_json);
                  esp_err_t forecast_result =
                      hko_http_get(
                          HKO_FORECAST_URL,
                          &forecast_json);

                  if (current_result == ESP_OK) {
                      current_result =
                          parse_hko_current(current_json);
                  }
                  if (forecast_result == ESP_OK) {
                      forecast_result =
                          parse_hko_forecast(forecast_json);
                  }

                  free(current_json);
                  free(forecast_json);

                  if (current_result != ESP_OK &&
                      forecast_result != ESP_OK) {
                      strlcpy(
                          weather_desc_text,
                          "HKO WEATHER UNAVAILABLE - RETRYING",
                          sizeof(weather_desc_text));
                      strlcpy(
                          weather_update_text,
                          "CHECK WI-FI / INTERNET CONNECTION",
                          sizeof(weather_update_text));
                  } else if (current_result != ESP_OK) {
                      strlcpy(
                          weather_now_text,
                          "CURRENT WEATHER UNAVAILABLE",
                          sizeof(weather_now_text));
                  } else if (forecast_result != ESP_OK) {
                      for (int index = 0; index < 3; index++) {
                          strlcpy(
                              forecast_text[index],
                              "---\\n-- C\\nFORECAST UNAVAILABLE",
                              sizeof(forecast_text[index]));
                      }
                  }

                  refresh_weather_labels();
                  ulTaskNotifyTake(pdTRUE, pdMS_TO_TICKS(HKO_REFRESH_MS));
              }
          }

          static void install_hko_dashboard_once(void)
          {
              nvs_handle_t handle;
              uint8_t installed = 0;

              if (nvs_open(
                      "display_cfg",
                      NVS_READWRITE,
                      &handle) != ESP_OK) {
                  return;
              }

              nvs_get_u8(handle, "hko_dash_v2", &installed);

              if (installed != 1 &&
                  write_display_html(
                      DEFAULT_DISPLAY_HTML,
                      strlen(DEFAULT_DISPLAY_HTML)) == ESP_OK) {
                  nvs_set_u8(handle, "hko_dash_v2", 1);
                  nvs_commit(handle);
              }

              nvs_close(handle);
          }

          static void render_display_html(const char *html);

          static void reload_display_locked(void)
          {
              char *html =
                  read_text_file(
                      DISPLAY_HTML_PATH,
                      DISPLAY_HTML_MAX);

              if (html == NULL) {
                  render_display_html(DEFAULT_DISPLAY_HTML);
                  schedule_full_redraw();
                  return;
              }

              render_display_html(html);
              free(html);
              schedule_full_redraw();
          }

          static void reload_display_async(void *argument)
          {
              (void)argument;
              reload_display_locked();
          }

