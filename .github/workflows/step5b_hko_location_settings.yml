          DISPLAY_HTML

      - name: Build firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/project:/project" \
            -w /project \
            espressif/idf:v5.5.2 \
            bash -lc '
              set -e
              git config --global --add safe.directory /project
              . /opt/esp/idf/export.sh

              rm -rf build sdkconfig
              idf.py set-target esp32s3
              idf.py build
              idf.py merge-bin -f raw

              cp build/merged-binary.bin \
                 /project/STEP5B-HKO-LOCATION-FULL.bin
              cp build/ESP32-8048S050C.bin \
                 /project/STEP5B-HKO-LOCATION-OTA-APP.bin

              cat > /project/README.txt <<EOF
          STEP 5B CONFIGURABLE HKO WEATHER LOCATION

          - Choose the HKO temperature station from the ESP32 settings page
          - Saving the station triggers an immediate weather refresh
          - Selection is stored in NVS and survives power loss
          - Current temperature uses the selected HKO station
          - Humidity is the HKO humidity reading
          - Multi-day forecast is the territory-wide HKO forecast
          - Weather refreshes every 30 minutes
          - Original stable double-framebuffer display mode retained

          OTA:
          Upload STEP5B-HKO-LOCATION-OTA-APP.bin only.
          Never upload FULL.bin through the web OTA page.
          EOF

              ls -lh /project/STEP5B-HKO-LOCATION-*.bin
            '

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: STEP5B-HKO-Location-Settings
          path: |
            project/STEP5B-HKO-LOCATION-OTA-APP.bin
            project/STEP5B-HKO-LOCATION-FULL.bin
            project/display_hko_clock_weather.html
            project/README.txt
          if-no-files-found: error
